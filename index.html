ender equality as a necessary condition to achieve empowerment of women. Also examine the role of women empowerment in curbing the menace of female foeticide."},{"l":"b","m":"15","t":"What insights does the Arthaśāstra offer with regard to the concept of sovereignty? Does it have any relevance in modern times? Critically discuss."},{"l":"c","m":"15","t":"Discuss the role of the ethical principles of tolerance and coexistence for the rise of multicultural societies."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Can there be a religion without morality? Discuss."},{"l":"b","m":"10","t":"Write a note on the notion of absolute truth in the context of religion."},{"l":"c","m":"10","t":"Discuss the concept of liberation (Apavarga) according to Nyāya-Vaiśeṣika."},{"l":"d","m":"10","t":"Discuss the role of reason in religion."},{"l":"e","m":"10","t":"Explain the analogical nature of religious language."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Is it necessary to adhere to the notions of immortality of the soul and rebirth in order to have a robust conception of liberation? Give reasons and justifications for your answer."},{"l":"b","m":"15","t":"How is the notion of God in Spinoza's philosophy embedded in his metaphysics of substance and attributes? Critically discuss."},{"l":"c","m":"15","t":"\"The problem of evil is a direct offshoot of how God is conceptualised in a system.\" Critically discuss."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"State and evaluate Buddhism as a religion without God."},{"l":"b","m":"15","t":"What kind of epistemic justifications are possible with regard to claims to revelation? Discuss with your own comments."},{"l":"c","m":"15","t":"Present an exposition of the ontological proof for the existence of God along with its criticism."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Distinguish between cognitivist and non-cognitivist accounts of religious language. Does the cognitivist account lead to any contradiction? Answer with reference to the philosophical views of R. B. Braithwaite."},{"l":"b","m":"15","t":"\"In order to be conceived as the ultimate cause of the world, God must necessarily have some form of physical manifestation.\" Do you agree with this view? Give reasons and justifications for your answer."},{"l":"c","m":"15","t":"Discuss the main features of religious experience according to Advaita Vedanta."}]}]},{"year":2023,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"\"Percepts without concepts are blind and concepts without percepts are empty.\" In the light of this statement, discuss how Kant reconciles rationalism with empiricism."},{"l":"b","m":"10","t":"\"History is a process of dialectical change.\" In the light of this statement, discuss Hegel's approach in understanding history."},{"l":"c","m":"10","t":"\"That thing is said to be free which exists solely from the necessity of its own nature, and is determined to action by itself alone.\" Discuss Spinoza's views on freedom and determinism in the light of the above statement."},{"l":"d","m":"10","t":"How does Kierkegaard argue against Hegel's idea of universal spirit in favour of the individual as the essence of spirit? Critically discuss."},{"l":"e","m":"10","t":"What are the main arguments offered by Kant to prove that a priori synthetic judgments are possible? Discuss with examples."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Critically analyse Hume's argument that causality is a matter of habit or custom involving the psychological principle of association."},{"l":"b","m":"15","t":"Present an exposition of Aristotle's distinction between actuality and potentiality. Does it provide a solution to the problem of being and becoming as presented in ancient Greek philosophy? Discuss with suitable examples."},{"l":"c","m":"15","t":"Discuss Descartes' theory of innate ideas and the grounds on which Locke refutes it."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Does the rejection of metaphysics as proposed by the Logical Positivists relate to the problem of meaning, or the problem of knowledge, or the nature of things, or all of them together? Discuss with suitable examples."},{"l":"b","m":"15","t":"Elucidate the significance of bracketing and reduction in Husserl's phenomenological method."},{"l":"c","m":"15","t":"\"Consciousness is what it is not and is not what it is.\" In the light of this statement, bring out the chief features of Sartre's conception of consciousness."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Why does Strawson consider person to be a primitive concept? What implication does it have for mind-body dualism? Discuss."},{"l":"b","m":"15","t":"Why, according to Russell, is the proposition \"The present king of France is bald\" problematic? Critically discuss."},{"l":"c","m":"15","t":"What were the main reasons that led Wittgenstein to shift from the picture theory of meaning to the use theory of meaning? Critically discuss."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"\"All human knowledge is empirical and therefore relative.\" Critically examine the Jaina theory of sevenfold judgement (saptabhaṅgīnaya) in the light of the above statement."},{"l":"b","m":"10","t":"\"If Puruṣa and Prakṛti are two completely independent realities, then no relation between the two is possible.\" In the light of this statement, make a brief presentation of Śaṅkara's criticism of Sāṁkhya dualism."},{"l":"c","m":"10","t":"What is the Advaitin interpretation of the great sentence (mahāvākya) \"Thou art that\" (tat tvam asi)? Briefly discuss."},{"l":"d","m":"10","t":"Present an account of the Vaiśeṣika view of negation in the light of their statement, \"Negation always has a counterpositive and absolute negation is an impossibility\"."},{"l":"e","m":"10","t":"Explain the nature and role of the Supermind in evolution as per Aurobindo's philosophy."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Discuss Rāmānuja's criticism of Śaṅkara's conception of Brahman and Īśvara (God)."},{"l":"b","m":"15","t":"Present the Bhāṭṭa view of anupalabdhi (non-cognition) as a valid means of knowledge."},{"l":"c","m":"15","t":"Elucidate the Naiyāyika view of ordinary and extraordinary perception. Are they justified in accepting that universals are perceived? Discuss."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Elucidate the Naiyāyika account of the fallacies of the middle term in relation to the five characteristics of a valid middle term."},{"l":"b","m":"15","t":"Liberation is defined by Advaita Vedāntins as 'attainment of that which is already attained'. How does Śaṅkara illustrate this statement? Discuss with your own comments."},{"l":"c","m":"15","t":"Explain citta and its modifications in the philosophy of Yoga. Why does Yoga philosophy prescribe cessation of the modifications of citta? Give reasons in support of your answer."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"\"Ignorance of dependent origination is suffering, while its knowledge is cessation of suffering.\" Present an account of Buddhist soteriology in the light of the above statement."},{"l":"b","m":"15","t":"Write a note on the Nyaya notion of Prāgabhāva (prior non-existence). How does this notion help Naiyāyikas in defending their position on causation against the Sāṁkhya view of causation? Critically discuss."},{"l":"c","m":"15","t":"Do words refer to universals or particulars or both? Present an exposition of the Nyaya and Mīmāṁsā positions with regard to the above question along with suitable examples."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"What is meant by justice as fairness? Explain Rawls' theory of justice."},{"l":"b","m":"10","t":"Critically examine the anarchist's view that \"all States always and everywhere are illegitimate and unjust\"."},{"l":"c","m":"10","t":"Do you agree that rights concerning land and property have empowered women? Discuss."},{"l":"d","m":"10","t":"Critically examine the challenges faced by a multicultural society with reference to India."},{"l":"e","m":"10","t":"If monarchs are above politics, can monarchy be a systematic form of government? Discuss."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Elucidate why the absolute nature of sovereignty was rejected by Laski."},{"l":"b","m":"15","t":"Do you agree that duty and accountability must be given priority over rights for the better functioning of a State? Justify your answer."},{"l":"c","m":"15","t":"In the present scenario, will the emphasis on skill education enhance development? Evaluate."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Explain Historical Materialism and discuss its relevance in the context of social development and change."},{"l":"b","m":"15","t":"Critically analyze the social and political significance of Ambedkar's notion of annihilation of caste."},{"l":"c","m":"15","t":"How does gender discrimination lead to female foeticide and social imbalance? Discuss."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"\"Severity of punishment should be proportionate to the seriousness of the crime.\" Do you agree that while punishing a juvenile, the nature of the crime should be considered? Justify your answer."},{"l":"b","m":"15","t":"Explain the challenges faced by a democratic state and the ways to overcome them."},{"l":"c","m":"15","t":"Secularism is not a rejection of religion but acceptance of all religions. Discuss."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Elucidate the personalistic and impersonalistic aspects of God."},{"l":"b","m":"10","t":"Can religious beliefs be justified? Discuss."},{"l":"c","m":"10","t":"Does religion influence moral behaviour? Explain the interactive relation between religion and morality."},{"l":"d","m":"10","t":"Discuss Wittgenstein's view about the non-cognitive nature of religious language."},{"l":"e","m":"10","t":"What is Agnosticism? How do agnostics conceptualize the relation between religion and God? Discuss."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Critically examine Plato's a priori proofs for the immortality of the soul."},{"l":"b","m":"15","t":"In what sense is God both immanent and transcendent in theism? Discuss."},{"l":"c","m":"15","t":"Explain the rational and irrational aspects of faith in the discourse of religion."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Critically examine the arguments of Nyaya for the existence of God."},{"l":"b","m":"15","t":"Examine the significance of the concept of rebirth in the theory of Karma."},{"l":"c","m":"15","t":"Explain the symbolic nature of religious language according to Tillich."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"\"All evil is either sin or punishment for sin.\" (St. Augustine) Critically discuss."},{"l":"b","m":"15","t":"Does religious pluralism invite inter-religious conflicts and destroy the truth of religion? Discuss."},{"l":"c","m":"15","t":"Examine the relation between mystical experience and revelation, and expound their significance in religious life."}]}]},{"year":2022,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"How does Plato use the theory of forms to establish the relation between epistemology and metaphysics? Discuss."},{"l":"b","m":"10","t":"What is Bertrand Russell's method of logical analysis? How does it ultimately end in establishing the atomic theory of meaning? Discuss."},{"l":"c","m":"10","t":"Establish the tenability of later Wittgenstein's notion of language as a form of life."},{"l":"d","m":"10","t":"What is psychologism? Critically discuss the way Edmund Husserl avoids the problem of psychologism in the discourse of transcendental phenomenology."},{"l":"e","m":"10","t":"What is apperception, according to Immanuel Kant? Discuss with reference to his transcendental exposition of space and time."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Provide a critical account of Heidegger's Being-in-the-world and discuss the problem of 'authenticity' in the context of Dasein."},{"l":"b","m":"15","t":"Is Aristotle's view of the nature of identity in consonance with his metaphysical view of causes as processes? Discuss giving suitable examples."},{"l":"c","m":"15","t":"Discuss the concept of substance according to Spinoza. Does his discussion on substance lead to pantheism? Substantiate your view."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"How does Kant construct antinomies to illustrate the illusory tendencies of pure reason? Explain and examine the antinomies presented by Kant."},{"l":"b","m":"15","t":"What is the dialectical method in the philosophy of Georg Wilhelm Hegel? How does this method help in realizing the Absolute? Discuss."},{"l":"c","m":"15","t":"Is there any difference between pictorial form and logical form in Ludwig Wittgenstein's picture theory of language? How does the logical form define the relation between language and reality? Explain."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"How does Søren Kierkegaard define the notion of 'subjectivity'? Explain it with reference to the three stages of existence as propounded by him."},{"l":"b","m":"15","t":"How does René Descartes explain the notion of certainty with reference to knowledge of the self? Critically discuss the way it differs from the knowledge of the world."},{"l":"c","m":"15","t":"Why and how does John Locke refute innate ideas? Elucidate the nature and source of knowledge in Locke's epistemology."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Examine and evaluate the proofs given by Sāṁkhya philosophy to prove the existence of Puruṣa."},{"l":"b","m":"10","t":"What is the ontological status of Sāmānya, according to Vaiśeṣika philosophy? Critically examine."},{"l":"c","m":"10","t":"Discuss the nature and different stages of Samādhi as per Pātañjala Yoga and examine the role of Īśvara in it."},{"l":"d","m":"10","t":"How does the Jaina view of Karma bear upon their soteriology? Critically discuss."},{"l":"e","m":"10","t":"Do you agree with the view that 'Vivartavāda is the logical development of Pariṇāmavāda'? Give reasons in support of your answer."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"How compatible is the Buddhist theory of momentariness with their theory of Karma? In this regard, how do Buddhists respond to objections raised by their opponents? Critically discuss."},{"l":"b","m":"15","t":"\"The doctrine of 'Relativism' of Jaina philosophy cannot be logically sustained without postulating 'Absolutism'.\" Critically examine this view and give reasons in favour of your answer."},{"l":"c","m":"15","t":"How do the Mīmāṁsakas refute the Nyaya view that Implication (arthāpatti) is reducible to Inference (anumāna) and establish Implication as an independent means of valid knowledge (pramāṇa)? Critically discuss."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"In spite of accepting the intrinsic validity of knowledge, why and how do Prabhākara and Kumārila differ in their interpretation of erroneous cognition? Discuss."},{"l":"b","m":"15","t":"Explain the Buddhist concept of Triratna and their internal relation. Critically examine the consistency of the Triratnas with the Buddhist concept of No-soul (Nairātmyavāda)."},{"l":"c","m":"15","t":"How do Naiyāyikas respond to Cārvāka's objections against inference (anumāna) and establish inference as an independent means of knowledge? Critically discuss."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"\"Brahma satyaṁ jagat mithyā, jīvo brahmaiva nāparaḥ.\" In the light of this statement, explain the ontological status of Īśvara, Jīva and Sākṣī as elucidated in Advaita Vedānta."},{"l":"b","m":"15","t":"Explain and evaluate the role of integral yoga in the process of triple transformation for individual evolution as expounded by Sri Aurobindo."},{"l":"c","m":"15","t":"How does the concept of liberation (Mokṣa) of Madhvācārya differ from that of Rāmānujācārya? Explain."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"Discuss the role of the enlightenment movement in the rise of humanism."},{"l":"b","m":"10","t":"In the age of individualism and universal franchise, what role does caste play in body-politic? Discuss."},{"l":"c","m":"10","t":"Is corruption a systemic issue or an ethical issue? Give your critical comments."},{"l":"d","m":"10","t":"\"Complete liberty may lead to inequality while order and restrictions imply a necessary loss of freedom.\" Critically discuss."},{"l":"e","m":"10","t":"What are the moral justifications of capital punishment? Discuss."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"What arguments does Bodin present to contend that sovereignty must be absolute, perpetual and undivided? Is Bodin's conception of sovereignty compatible with the social and political ideals of equality, justice and liberty? Critically discuss."},{"l":"b","m":"15","t":"Critically evaluate Gandhi's views on eradication of caste discrimination."},{"l":"c","m":"15","t":"Explain the difference between the notion of equity and equality with reference to Marxian philosophy."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Do you agree that economic development does not on its own lead to human development and social progress? Give reasons and justifications for your answer."},{"l":"b","m":"15","t":"Discuss gender as a cultural category as opposed to sex as a biological category."},{"l":"c","m":"15","t":"Critically analyze the descriptive and normative aspects of multiculturalism."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Discuss propaganda as a challenge to the democratic form of government."},{"l":"b","m":"15","t":"Does the idea of unconditional rights necessarily lead to anarchy? Critically examine."},{"l":"c","m":"15","t":"Are monarchy and theocracy necessarily related? Discuss with reference to the theory of Divine Right."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Write an essay on Spinoza's notion of God and His attributes."},{"l":"b","m":"10","t":"\"One can have morality without religion but not religion without morality.\" Discuss."},{"l":"c","m":"10","t":"\"Immortality of Soul is a necessary postulate for rebirth.\" Critically examine with reference to Buddhism."},{"l":"d","m":"10","t":"Is the notion of faith indispensable for the idea of revelation? Critically comment."},{"l":"e","m":"10","t":"Explain the difference between the cognitivist and non-cognitivist approaches to religious language with reference to the statement \"God exists\"."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Present a critical exposition of the different arguments offered by St. Thomas Aquinas to prove the existence of God, also known as the 'Five Ways'. Which one of them do you find philosophically most interesting? Give reasons in support of your answer."},{"l":"b","m":"15","t":"Explain the relation between God and the Self according to Rāmānujācārya."},{"l":"c","m":"15","t":"If God is the Absolute Creator, then the responsibility of evil cannot belong to the human agent. Critically examine."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"\"An unquestionable acceptance of only one Absolute Truth will inevitably result in religious exclusivism.\" Discuss."},{"l":"b","m":"15","t":"Is it possible to have an idea of Liberation without the conception of a real agent? In this context, discuss the difference between Advaita and Viśiṣṭādvaita systems of thought."},{"l":"c","m":"15","t":"Discuss the nature and variety of religious experiences as presented by William James."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Discuss the main points of distinction between a priori and a posteriori arguments for the existence of God. Which one, according to you, should be preferred over the other? Give reasons and justifications for your answer."},{"l":"b","m":"15","t":"Discuss the nature of Soul and Bondage according to Jainism."},{"l":"c","m":"15","t":"Critically examine the idea of Brahman in the Advaita philosophy of Śaṅkara. Does Śaṅkara's conception of Brahman leave room for theism? Discuss."}]}]},{"year":2021,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"\"There is a red chair.\" How would Plato explain this statement with the use of his theory of forms? Examine."},{"l":"b","m":"10","t":"\"Potentiality is indefinable\", according to Aristotle. Explain the relationship between potentiality and actuality with reference to the above philosophical position by taking the example of a \"wooden table\"."},{"l":"c","m":"10","t":"\"Sensible things are those only which are immediately perceived by sense.\" Explain Berkeley's theory of knowledge with reference to the above statement."},{"l":"d","m":"10","t":"Examine the concept of personal identity by Locke."},{"l":"e","m":"10","t":"\"The relation between cause and effect is one of constant conjunction.\" Examine Hume's criticism of causation in the light of the above statement."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Discuss Hegel's dialectical method. Explain how his dialectical method leads him to Absolute Idealism."},{"l":"b","m":"15","t":"What, according to Logical Positivists, are \"pseudo statements\"? How does one identify \"pseudo statements\"? Critically discuss with examples."},{"l":"c","m":"15","t":"Explain how the Cartesian formulation of the ontological argument is criticized by Kant."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"What are the main arguments put forward by Moore in his paper \"A Defence of Common Sense\" to prove that there are propositions about the world that are known to be true with certainty? Do you think Moore's arguments provide a sufficient response to objections presented by the sceptic against the possibility of knowledge? Give reasons in support of your answer."},{"l":"b","m":"15","t":"What, according to Strawson, are basic particulars? What reasons does Strawson offer to believe that 'material bodies' and 'persons' are basic particulars? Critically discuss."},{"l":"c","m":"15","t":"Critically examine Quine's postulate of empiricism without the dogmas with reference to his 'Two Dogmas of Empiricism'."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Present a critical exposition of Husserl's criticism of the 'natural attitude'. How does Husserl propose to address the problems involved in the natural attitude through his phenomenological method?"},{"l":"b","m":"15","t":"\"I can always choose, but I ought to know that if I do not choose, I am still choosing.\" Critically discuss Sartre's conception of choice and responsibility in the light of the above statement."},{"l":"c","m":"15","t":"What does Wittgenstein mean by the statement \"Whereof one cannot speak, thereof one must be silent\"? Critically discuss."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Does the seed contain the tree? Discuss with reference to Nyāya-Vaiśeṣika philosophy."},{"l":"b","m":"10","t":"Explain, with reference to Nyāya philosophy, the nature of śabda as the advice of āpta (a reliable person)."},{"l":"c","m":"10","t":"Is 'inseparability' (ayuta-siddhatva) a necessary condition or a sufficient condition for the defining characteristic (lakṣaṇa) of samavāya (inherence)? Explain with reference to Vaiśeṣika philosophy."},{"l":"d","m":"10","t":"Distinguish between pudgala-nairātmyavāda and dharma-nairātmyavāda with reference to Buddhist philosophy."},{"l":"e","m":"10","t":"Comment on the bearing of Cārvāka epistemology on the rejection of transcendental entities by them."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Explain, with reference to Yoga philosophy, the nature of kleśas. How does the removal of these lead to kaivalya?"},{"l":"b","m":"15","t":"Explain the Sāṁkhya view on the three guṇas (guṇa-traya) and their modifications."},{"l":"c","m":"15","t":"What, according to Mīmāṁsakas, is the ontological status of abhāva (absence) and how does one know it? Explain and examine."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"How do the advocates of anirvacanīya-khyāti refute the position of the Naiyāyikas and establish the position of the Advaitins regarding the problem of error? Critically discuss."},{"l":"b","m":"15","t":"If everything is momentary, then how do the Buddhists explain the problem of memory and personal identity? Critically discuss."},{"l":"c","m":"15","t":"Explain the Jaina view of seven-fold (sapta-bhaṅgī) 'Naya'."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"According to Sri Aurobindo, \"the awakening of the psychic being and its gradual prominence over all other parts of the being is the first step in the conscious evolution of man\". Explain and examine."},{"l":"b","m":"15","t":"Compare and contrast the views of Śaṅkara and Rāmānuja regarding the status of the world."},{"l":"c","m":"15","t":"Explain the status of jīva and jagat in the philosophy of Mādhvācārya."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"Discuss critically the distributive theory of justice as propounded by R. Nozick."},{"l":"b","m":"10","t":"How does Rousseau distinguish between natural and artificial inequality? Explain."},{"l":"c","m":"10","t":"Is Austin's theory of sovereignty compatible with democracy? Discuss."},{"l":"d","m":"10","t":"Does monarchy as a form of government leave room for individual freedom? Explain."},{"l":"e","m":"10","t":"How far can land and property rights be effective in the empowerment of women? Explain."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Discuss whether Amartya Sen's idea of justice is an improvement upon Rawls' theory of justice."},{"l":"b","m":"15","t":"Explain the reformative theory of punishment and discuss whether this is in tune with human dignity."},{"l":"c","m":"15","t":"Can humanism be a substitute for religion? Explain and evaluate in the context of present Indian society."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Discuss anarchism as a political ideology. Is it possible to dispense with political authority completely? Give reasons for your answer."},{"l":"b","m":"15","t":"Discuss the distinctive features of Gandhian Socialism and its contemporary relevance."},{"l":"c","m":"15","t":"Discuss Kautilya's contribution regarding the concept of sovereignty. Is it applicable in a democratic form of government? Explain."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Discuss the views of Dr. B. R. Ambedkar regarding caste discrimination in Indian society. What are the measures suggested by him for its elimination? Explain."},{"l":"b","m":"15","t":"What are the main causes of female foeticide in India? Is it the result of demonic application of technology only? Discuss."},{"l":"c","m":"15","t":"Evaluate whether the social contract theory adequately addresses the different issues of human rights."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Discuss the nature of God as propounded in Nyaya philosophy."},{"l":"b","m":"10","t":"Discuss the possibility of Absolute Truth in the context of religious pluralism."},{"l":"c","m":"10","t":"Is religious freedom possible in a multireligious society? Explain."},{"l":"d","m":"10","t":"Is religious life possible without the belief in God? Discuss."},{"l":"e","m":"10","t":"Discuss the paradox of omnipotence of God in the context of the existence of evil."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Discuss the concept of immortality of the soul with special reference to the Hindu tradition."},{"l":"b","m":"15","t":"Elucidate the concept of liberation according to Advaita Vedanta. Explain the role of knowledge in the attainment of liberation."},{"l":"c","m":"15","t":"Do you consider that religion and morality are inseparable? Give reasons for your answer."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Discuss the role of reason and faith in religion. Can reason be a regulative force in the formulation of religious beliefs? Explain."},{"l":"b","m":"15","t":"Give a critical account of the moral argument to prove the existence of God."},{"l":"c","m":"15","t":"Explain the concept of religious experience in the light of the Vedantic tradition."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"What is the non-cognitive theory of religious language? Explain critically in the light of R. B. Braithwaite's views."},{"l":"b","m":"15","t":"Discuss and evaluate the doctrine of Karma as an essential postulate of Hinduism."},{"l":"c","m":"15","t":"Explain the symbolic nature of religious language with special reference to Paul Tillich."}]}]},{"year":2020,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"How does Aristotle argue for the priority of Form over Matter and Actuality over Potentiality? Critically discuss."},{"l":"b","m":"10","t":"How does Leibniz's conception of monads bear upon his views on determinism and freedom? Discuss with your own comments."},{"l":"c","m":"10","t":"What, according to Husserl, is wrong with psychologism? How does Husserl address the problems with psychologism in his phenomenological method?"},{"l":"d","m":"10","t":"Examine the reality of the phenomenal world in the light of Hegel's Absolute Idealism."},{"l":"e","m":"10","t":"\"The Soul of Superman is Good.\" Critically examine the above statement in the light of logical positivism."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"\"I never can catch myself at any time without a perception, and never can observe anything but the perception.\" How does this statement by Hume problematize the philosophical notion of personal identity? How does Kant deal with this problem in his Critique of Pure Reason?"},{"l":"b","m":"15","t":"Critically discuss the following statement by Moore: \"If anyone tells us that to say 'Blue exists' is the same thing as to say that 'Both blue and consciousness exist', he makes a mistake and a self-contradictory mistake.\""},{"l":"c","m":"15","t":"\"The reason that I call my doctrine logical atomism is because the atoms that I wish to arrive at as the sort of last residue in analysis are logical atoms and not physical atoms.\" Write a note on the nature of atomic facts according to Russell in the light of the above statement."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"What does Kierkegaard mean by saying \"Subjectivity is the truth\" in the context of the problem of 'the single individual'?"},{"l":"b","m":"15","t":"Evaluate the role of spatio-temporal thinking in objective thinking with reference to Strawson's theory of basic particulars."},{"l":"c","m":"15","t":"When does Pure Reason enter into the realm of Antinomies according to Kant? Is Kant's notion of Antinomies of Pure Reason a natural culmination of his distinction between Phenomena and Noumena? Provide reasons in favour of your answer."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"\"You can always make something out of what you have been made into.\" Critically discuss this statement by Sartre with reference to his views on existentialism."},{"l":"b","m":"15","t":"\"From the necessity of the divine nature there must follow infinitely many ways.\" Explain this statement by Spinoza along with some possible criticisms."},{"l":"c","m":"15","t":"\"But could we also imagine a language in which a person could write down or give vocal expression to his inner experiences, his feelings, moods and the rest, for his private use?\" Critically discuss the answer offered by Wittgenstein to this question."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Examine the concept of Karma according to Jainism. How does it bear upon their conception of Liberation?"},{"l":"b","m":"10","t":"Explain the difference between Samprajñāta Samādhi and Asamprajñāta Samādhi."},{"l":"c","m":"10","t":"Why is memory not valid knowledge according to Mīmāṁsā?"},{"l":"d","m":"10","t":"Point out the significance of the five-fold differences in the Dualistic School of Vedānta."},{"l":"e","m":"10","t":"Discuss the nature and types of matter according to Nimbārka."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"How is Kṣaṇikavāda a logical derivative of Pratītyasamutpāda in Buddhism? Explain."},{"l":"b","m":"15","t":"Critically evaluate Cārvāka's rejection of Ākāśa as one of the elements of reality and examine their criticism of transmigration of the Soul."},{"l":"c","m":"15","t":"Explain the concepts of 'Anyathāsiddha' and 'Ananyathāsiddha' in the context of Asatkāryavāda."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"\"A mango tree is grown out of a mango seed.\" How will the Sāṁkhya system explain this process through their theory of causation by rejecting their rival perspectives?"},{"l":"b","m":"15","t":"How does Buddhism explain the Self in terms of Pañcaskandhas? What is Liberation for Buddhism if there is no Soul?"},{"l":"c","m":"15","t":"Explain the differences of conception of Reality between Cārvāka and Jainism."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"What does Aurobindo mean by the life divine as a possibility and inevitability?"},{"l":"b","m":"15","t":"Critically evaluate the logical and metaphysical status of Viśeṣa in the context of Vaiśeṣika philosophy."},{"l":"c","m":"15","t":"Discuss the nature and relationship of Jīva and Jīva-sākṣī to non-dualism."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"Is the concept of 'liberty' realizable in modern technological society? Explain."},{"l":"b","m":"10","t":"How far do liberal democracies safeguard the interests of minorities? Evaluate critically."},{"l":"c","m":"10","t":"Do you think that secularism requires complete separation of religion and 'state'? Discuss."},{"l":"d","m":"10","t":"Explain the importance of Bodin's theory of sovereignty."},{"l":"e","m":"10","t":"Do you think that the prevailing pandemic will lead to anarchism in society? Discuss."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"State and examine the Gandhian concept of social development."},{"l":"b","m":"15","t":"How far is Marxism as a philosophical doctrine relevant in the present context? Justify your answer."},{"l":"c","m":"15","t":"Is Indian tradition antagonistic to Individual Rights? Consider it by taking recourse to the doctrine of Human Rights."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"State and examine B. R. Ambedkar's contribution towards social changes in Independent India."},{"l":"b","m":"15","t":"What do you understand by multiculturalism? Explain the structural characteristics that make a nation multicultural."},{"l":"c","m":"15","t":"Do you think that the retributive theory of punishment is against human rights? Discuss."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Do you agree that empowering women can eliminate gender discrimination? Discuss."},{"l":"b","m":"15","t":"State and explain the relevance of the doctrine of sovereignty in times of globalization."},{"l":"c","m":"15","t":"How far do social and political regimes condition corrupt practices in a nation-state? Discuss."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Discuss the significance of 'Religion' vis-à-vis present scientific and technological development."},{"l":"b","m":"10","t":"The concept of 'Immortality' is a basic presupposition of religion. Elaborate your answer."},{"l":"c","m":"10","t":"Is it acceptable that the History of Religions is the History of Conflicts? Discuss."},{"l":"d","m":"10","t":"Is there any compatibility between 'Freedom of Will' and an 'Omnipotent God'? Discuss."},{"l":"e","m":"10","t":"What is the importance of religious tolerance in a multicultural pluralistic society? Justify your answer."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Is the ontological proof for the existence of God by St. Anselm logical? Discuss."},{"l":"b","m":"15","t":"What is the logical problem of evil? Discuss."},{"l":"c","m":"15","t":"Critically examine the concept of God as a prerequisite for a religion."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Discuss the nature of God in Hinduism with special reference to Viśiṣṭādvaita (Qualified non-dualism)."},{"l":"b","m":"15","t":"Distinguish between prayer and worship and determine their place in religion."},{"l":"c","m":"15","t":"What are the basic tenets of faith? Distinguish between faith and belief."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Does religious language carry cognitive content? Elucidate in detail."},{"l":"b","m":"15","t":"Are religious beliefs and practices incompatible with moral behaviour? Discuss."},{"l":"c","m":"15","t":"Do you accept that Knowledge, Action and Devotion are the means to attain liberation in the Indian tradition? Discuss."}]}]},{"year":2019,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"What does Plato want to prove by his 'Allegory of the Cave'?"},{"l":"b","m":"10","t":"Can hallucination be regarded as an intentional act for Husserl? Explain."},{"l":"c","m":"10","t":"What is the role of dialectics in realizing the truth in Hegel's philosophy?"},{"l":"d","m":"10","t":"How does Descartes prove the existence of things other than himself and God? Discuss."},{"l":"e","m":"10","t":"Explain Quine's arguments against the synthetic-analytic distinction."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"How do the logical positivists account for the meaning of general statements? Can the same account be applied to metaphysical statements? Discuss."},{"l":"b","m":"15","t":"What are the reasons for developmental changes in substance according to Aristotle? Discuss."},{"l":"c","m":"15","t":"What do you understand by Spinoza's statement that what is, cannot be other than what it is? Explain."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Is Dasein authentic existence for Heidegger? How does he relate temporality with Dasein? Discuss."},{"l":"b","m":"15","t":"Show how Wittgenstein's critique of solipsism culminates in the critique of private language."},{"l":"c","m":"15","t":"Why is Moore's philosophy called common-sense realism?"}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"How does Kant argue for the transcendence of Space and Time? Discuss."},{"l":"b","m":"15","t":"Is there any element of necessity in causal relations according to Hume? Discuss."},{"l":"c","m":"15","t":"How does Sartre look at the problem of freedom of choice and determinism? Explain."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Justify the status of Abhāva as a category in Vaiśeṣika philosophy."},{"l":"b","m":"10","t":"How do the Yogācāra Buddhists deny the existence of the external world? Discuss."},{"l":"c","m":"10","t":"Are the Cārvākas consistent when they hold that inference is not a source of knowledge? Discuss."},{"l":"d","m":"10","t":"Critically discuss the metaphysical status of a Jīva and a Puruṣa according to Sāṁkhya philosophy."},{"l":"e","m":"10","t":"How did Mīmāṁsā establish the authority of Vedic knowledge?"}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"How is reality defined by the Jainas? How is this theory of reality reflected in their view on judgements? Discuss."},{"l":"b","m":"15","t":"What is the role of jñānalakṣaṇa-pratyakṣa in explaining anyathākhyāti?"},{"l":"c","m":"15","t":"What is wrong, according to the Cārvākas, with the following argument: All men are mortal; Socrates is a man; therefore, Socrates is mortal? Justify your answer with arguments."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"How does Udayana prove the existence of God through Kāryāt, Āyojanāt, Dhṛtyādeḥ and Śruteḥ? Discuss."},{"l":"b","m":"15","t":"How would Yoga philosophy comprehend the citta-levels of a scientist, a God-realized devotee and a self-realized yogi? Justify your answer."},{"l":"c","m":"15","t":"What is Pratītyasamutpāda? How do the Buddhists apply this concept to prove that everything is momentary?"}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Explain the logical consequences of the metaphysical absolutism of Advaitism."},{"l":"b","m":"15","t":"Explain the unique position of the supermind in the metaphysical scheme of Aurobindo's philosophy."},{"l":"c","m":"15","t":"Which Sāṁkhya proof for the existence of Prakṛti actually shows that there can be only one Prakṛti? Justify your answer."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"How far do you think John Rawls is continuing with Plato's concept of justice?"},{"l":"b","m":"10","t":"Discuss the status of theocracy in the modern secular state."},{"l":"c","m":"10","t":"Evaluate Mahatma Gandhi as a political anarchist."},{"l":"d","m":"10","t":"Is corruption not a form of mass violence? Discuss."},{"l":"e","m":"10","t":"Can gender equality be realized within a socialist regime? Analyse."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Do rights make citizens accountable to the state? Argue in the context of the present Indian scenario."},{"l":"b","m":"15","t":"What are the descriptive and normative perspectives on ideas of multiculturalism?"},{"l":"c","m":"15","t":"Does technological development lead to progress in the ethical standards of society? Explain."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Discuss how far Austin's concept of sovereignty goes along with Kautilya's concept of sovereignty."},{"l":"b","m":"15","t":"Consider critically that gender discrimination is rather a man-made concept and not naturally endowed."},{"l":"c","m":"15","t":"What do you consider to be the future of Marxism in the context of the prevalent free market economy?"}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Examine whether there is any difference between the views of Mahatma Gandhi and Dr. Babasaheb Ambedkar on the philosophical foundations of secular democracy."},{"l":"b","m":"15","t":"Does liberty put limitations to equality? Discuss."},{"l":"c","m":"15","t":"Does capital punishment weaken the doctrine of social justice? Discuss."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"What is instrumental to self-revelation: Faith or Reason? Justify your position."},{"l":"b","m":"10","t":"Is religion a uniting force for humanity in the globalizing world as of today? Discuss."},{"l":"c","m":"10","t":"Can there be a philosophical argument to support violence in the name of religion? Discuss."},{"l":"d","m":"10","t":"Does a devoted commitment to a religious way of life make man go astray from social morality? Examine."},{"l":"e","m":"10","t":"State and evaluate the proofs for the existence of God as propounded in Jainism."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Discuss whether and how religious symbolism leads to mysticism."},{"l":"b","m":"15","t":"What role do the concepts of evil and the profane play in providing a firm foundation to religion?"},{"l":"c","m":"15","t":"How would a religious person deny the possibility of a religion without God? Discuss."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Expound and explain the central problem in the discussion between religious pluralists and religious exclusivists."},{"l":"b","m":"15","t":"Secular ethics cannot fully resolve why one should be moral all the time. Examine."},{"l":"c","m":"15","t":"How far can religious experience be made a topic of public discourse? Analyse."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"State and explain the doctrines of Karma, Rebirth and Reincarnation in Hinduism."},{"l":"b","m":"15","t":"State and evaluate the personalistic and impersonalistic aspects of God."},{"l":"c","m":"15","t":"Discuss the relationship between man and God according to any one of the religions in India."}]}]},{"year":2018,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"Are the two truths — \"The Sun will rise tomorrow\" and \"2+2=4\" — of the same necessity for Hume? Give reasons in favour of your answer."},{"l":"b","m":"10","t":"Is there any place for freedom in Leibniz's philosophy, when he speaks of 'pre-established harmony'? Discuss."},{"l":"c","m":"10","t":"How does the notion of 'family resemblance' help Wittgenstein to uphold that 'Language is a game'? Discuss."},{"l":"d","m":"10","t":"How does Sartre connect inauthenticity with bad faith? Why does Sartre show that inauthenticity and bad faith lead to alienation? Discuss."},{"l":"e","m":"10","t":"How does Strawson explain the concept of person in his philosophy? Discuss."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"What is the reason for the difference in the definitions and classifications of substance made by Descartes, Spinoza and Leibniz, in spite of the fact that they all belonged to the rationalist school of thought? Discuss."},{"l":"b","m":"15","t":"Explain the significance of the Kantian dictum, 'Understanding makes Nature'. How far do you agree that Hegel's Absolutism is the culmination of Kantian Dualism? Discuss. Give reasons in favour of your answer."},{"l":"c","m":"15","t":"How does Quine show that the notion of a priori knowledge as discussed by Kant is a 'metaphysical article of faith'? Give reasons for your answer."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"How does Berkeley establish that Mind and its ideas alone are real? How do Moore and Russell react to Berkeley's view in this regard? Do you find any difference between Moore's reaction and Russell's one? Discuss."},{"l":"b","m":"15","t":"How do the logical positivists show that metaphysical sentences are meaningless? Can their verification theory of meaning account for the meaningfulness of all scientific sentences? Discuss."},{"l":"c","m":"15","t":"How does Wittgenstein apply the distinction between 'saying' and 'showing' to point to a single way of apprehending the most decisive problems of philosophy? Is he justified? Give reasons for your answer."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"What is Epoché? How does Heidegger reject this method of phenomenological reduction? Explain Heidegger's concept of 'being-in-the-world' as opposed to the concept of a transcendental ego."},{"l":"b","m":"15","t":"Is the relation between the Idea and the World as discussed by Plato logically consistent? Discuss Aristotle's views regarding this and also give arguments in favour of your answer."},{"l":"c","m":"15","t":"How is Russell's theory of definite descriptions related to his Logical Atomism? Discuss and give reasons for your answer."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"How do the Vaiśeṣika philosophers explain the difference of the relationships in the two cases — (i) the brown colour of the table and (ii) the book on the table? Discuss."},{"l":"b","m":"10","t":"How do the Mādhyamika Buddhists apply the notion of Pratītyasamutpāda to establish their doctrine of Śūnyatā? Discuss."},{"l":"c","m":"10","t":"What is the difference between the indescribability (Anirvacanīyatā) of Brahman and the indescribability (Anirvacanīyatā) of Māyā in the Advaita Vedānta system? Discuss."},{"l":"d","m":"10","t":"How do the Buddhists and the Nyāya philosophers explain our knowledge of 'the absence of the jar on the table'? Answer in detail."},{"l":"e","m":"10","t":"Is Puruṣa one or many? Explain the Sāṁkhya position in this regard and give arguments in support of your answer."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"How do the Naiyāyikas prove the existence of God? Do the Yoga philosophers prove God in the same way? If yes, how? And if not, why? Give reasons for your answer."},{"l":"b","m":"15","t":"Is it consistent for the Buddhists to admit the theory of Nairātmyavāda and the doctrine of Nirvāṇa simultaneously? Give reasons in favour of your answer."},{"l":"c","m":"15","t":"How do the Jaina philosophers explain 'bondage'? What, according to them, is the distinction between a 'liberated soul' and a 'bound soul'? What do the Jainas think about the condition of the 'liberated soul'? Discuss."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Give a comparative exposition of the concept of Mokṣa as found in the systems of Viśiṣṭādvaita, Dvaita, Śuddhādvaita and Acintyabhedābheda."},{"l":"b","m":"15","t":"How do the Advaita Vedāntins react to the Prakṛtipariṇāmavāda of Sāṁkhya philosophy? How do the Sāṁkhyas defend their own position in this regard? Discuss."},{"l":"c","m":"15","t":"How does Rāmānuja refute the doctrine of Māyā as propounded by Śaṅkara? Why is Māyā needed by both Rāmānuja and Śaṅkara to establish their doctrines? Discuss."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Does the admission of Svayaṁprakāśavāda necessarily lead to the admission of Svataḥprāmāṇyavāda? Discuss after the Naiyāyikas, the Mīmāṁsakas and the Advaita Vedāntins."},{"l":"b","m":"15","t":"Is the Cārvāka rejection of inference acceptable to the other systems of Indian philosophy? If not, why? Do you think the views of other systems to be justified? Give reasons for your answer."},{"l":"c","m":"15","t":"What is Evolution according to Sri Aurobindo? Describe the process of triple transformation and the nature of the gnostic being in his philosophy."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"What is meant by liberal democracy? Does it require deeper principles for social cohesion to balance its own strong affirmation of individual rights? Give reasons from the Indian context."},{"l":"b","m":"10","t":"Do you subscribe to the view that Indian cultural identity needs to integrate the principles of multi-culturalism and respect for the dignity of each person? Justify your answer."},{"l":"c","m":"10","t":"It is said that the traditional hold of caste-based groups on Indian social behaviour has survived all attempts to build alternate identities. Discuss in the light of M. K. Gandhi."},{"l":"d","m":"10","t":"Discuss Kautilya's concept of sovereignty in the light of 'Daṇḍa-nīti'."},{"l":"e","m":"10","t":"What measures do you suggest to eradicate corruption in Indian democracy?"}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"How far can liberty and equality be considered as distinctive features of democracy? Discuss."},{"l":"b","m":"15","t":"Critically evaluate Laski's view on sovereignty as a satisfactory position in political theory."},{"l":"c","m":"15","t":"Do you subscribe to the political ideology of the Anarchists? Justify your answer."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"What do you understand by multi-culturalism? How are globalization and multi-culturalism related? How does their relationship affect cultural changes?"},{"l":"b","m":"15","t":"Are Marxian Socialism and individual freedom consistent? Discuss critically."},{"l":"c","m":"15","t":"What form of humanism do you approve of as relevant in the present-day context? Discuss in detail."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"\"Human rights and human dignity would no longer be the product of a particular culture, rather a common human aspiration for an ideal world.\" Discuss."},{"l":"b","m":"15","t":"How do you evaluate gender discrimination in the context of female foeticide?"},{"l":"c","m":"15","t":"Is feminism an ideology for empowerment or for equality? Discuss."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"In what sense is the secular use of language different from the religious use of language? Discuss."},{"l":"b","m":"10","t":"How far is it plausible to argue that the anti-theistic religions' stand on the concept of rebirth is philosophically significant?"},{"l":"c","m":"10","t":"Can you justify religion without God? Support your answer."},{"l":"d","m":"10","t":"Can one claim that there is an inter-relatedness between 'religiosity' and 'immorality'? Discuss."},{"l":"e","m":"10","t":"Is Hinduism poly-theistic? Give reasons for your answer."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Distinguish between Exclusivism, Inclusivism and Pluralism with regard to the conflicting truth-claims of different religions."},{"l":"b","m":"15","t":"\"Truth is one, yet people perceive it differently.\" Critically evaluate by considering the present Indian context."},{"l":"c","m":"15","t":"Does the concept of God entail the existence of God? Examine from the perspective of the ontological argument."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"The terms 'Sacred' and 'Holy' have come to serve as generic names for the object of religion. Do you agree that one can have God as the object of religion? Discuss."},{"l":"b","m":"15","t":"Critically examine Braithwaite's non-cognitive theory of religious language."},{"l":"c","m":"15","t":"Evaluate the concept of Bhakti (Devotion) as a pathway to attain liberation."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Compare St. Thomas Aquinas' five ways of knowing God with the arguments of the Nyāya school of Indian philosophy for the existence of God."},{"l":"b","m":"15","t":"Critically evaluate the Buddhistic arguments against the existence of God as the creator of the world."},{"l":"c","m":"15","t":"Explain the significance of religious symbols as a transcendent referent that mediates into the cultural, spatial and temporal world."}]}]},{"year":2017,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"Elaborate Hegel's dictum: \"All identity is identity and difference.\""},{"l":"b","m":"10","t":"Explain Husserl's reasons for advocating phenomenological reductionism."},{"l":"c","m":"10","t":"How is the statement 'I met a man' semantically problematic for Russell? How does he account for the meaningfulness of this statement?"},{"l":"d","m":"10","t":"In what sense can ideas be both immanent and transcendent? Discuss in this context Plato's theory of universals and particulars."},{"l":"e","m":"10","t":"Show how Hume's analysis of experience leaves no ground for belief in any permanent reality, either physical or mental."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"How is 'all bodies are extended' an analytic judgement but 'all bodies are heavy' a synthetic judgement? Is 'every event has a cause' an analytic or a synthetic judgement? Explain."},{"l":"b","m":"15","t":"What is Wittgenstein's picture theory of meaning? What are his reasons for giving up this theory and suggesting the use theory of meaning?"},{"l":"c","m":"15","t":"Explain Aristotle's theory of form and matter. How does it help him resolve the problem of change and permanence?"}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Elaborate Kant's theory of space and time. How does this theory enable him to explain how mathematical propositions can be both synthetic and a priori?"},{"l":"b","m":"15","t":"What, according to Descartes, is a 'clear and distinct idea'? What is the epistemological status of clear and distinct ideas? Does this account help Descartes prove that material objects exist? Explain."},{"l":"c","m":"15","t":"What are the two dogmas of empiricism that Quine attacks? What are his arguments against what he calls the second dogma?"}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"How does Locke draw a distinction between primary and secondary qualities? Does he also draw a distinction between the idea of primary qualities and primary qualities, as well as the idea of secondary qualities and secondary qualities? Discuss."},{"l":"b","m":"15","t":"Does the sentence 'Whatever is coloured is extended' satisfy the criterion of meaningfulness proposed by the logical positivists? Explain."},{"l":"c","m":"15","t":"Discuss Heidegger's concept of authenticity and explain how an inauthentic Dasein regains the lost self."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"\"The soul is nothing but conscious body.\" What are the reasons for Cārvāka in holding this view?"},{"l":"b","m":"10","t":"What are the necessary characteristics of padārtha according to Vaiśeṣika philosophy?"},{"l":"c","m":"10","t":"Explain the conditions of a valid hetu as propounded in Nyāya philosophy."},{"l":"d","m":"10","t":"What is meant by \"yogaścittavṛttinirodhaḥ\"? Explain cittavṛtti and its effects according to Yoga philosophy."},{"l":"e","m":"10","t":"Elucidate the role of catuṣkoṭi in explaining the nature of reality according to the Mādhyamika school of thought."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Explain the early Nyāya definition of perception. Why is this definition considered inadequate by the later Naiyāyikas?"},{"l":"b","m":"15","t":"\"Jaina metaphysics is relativistic and realistic pluralism.\" Discuss."},{"l":"c","m":"15","t":"What are the arguments of the Buddhists to establish Kṣaṇikavāda? Do they necessarily lead to kṛtanāśa and akṛtābhyupagama?"}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"How do Mādhyamikas, Yogācāravādins and Sarvāstivādins differ among themselves concerning the nature of reality? How do Sarvāstivādins differ among themselves with regard to the knowability of reality?"},{"l":"b","m":"15","t":"How does Sri Aurobindo's integral yoga help in the realization of supramental consciousness? Discuss."},{"l":"c","m":"15","t":"Distinguish between vivartavāda and pariṇāmavāda with reference to causation, and explain how in the light of these theories Śaṅkara and Rāmānuja differ on the status of the world."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Explain the theory of validity of knowledge (prāmāṇyavāda) according to the Mīmāṁsakas. How did they criticize the Nyāya theory of validity?"},{"l":"b","m":"15","t":"Explain Rāmānuja's conception of God and examine the difficulties he faced in explaining the relation of God to matter and spirit."},{"l":"c","m":"15","t":"Given its theory of causation, is it possible for Sāṁkhya to explain the presence of consciousness in the world? Discuss."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"Discuss, in the context of anarchy, whether the freedom of an individual is consistent with the sovereignty of the State."},{"l":"b","m":"10","t":"Discuss whether a blending of monarchy with democracy is conceivable to avoid their undesirable defects for making the governance better for citizens and State."},{"l":"c","m":"10","t":"Is caste discrimination a result of the superiority complex of a privileged class of society or of religious rituals? Discuss with reference to the views propounded by Dr. B. R. Ambedkar."},{"l":"d","m":"10","t":"Out of rights and duties, which one is prior to the other? Discuss in the context of accountability."},{"l":"e","m":"10","t":"Discuss the different aspects of the fundamental distinction between democratic equality and the Marxian notion of equality."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Do you agree with the view that secularism as a western ideal is redundant in the Indian context? Discuss in the context of multicultural Indian society."},{"l":"b","m":"15","t":"Critically evaluate whether the ideal of social progress gives a secondary significance to an individual's freedom over his duties."},{"l":"c","m":"15","t":"Discuss whether Kautilya's concept of sovereignty turns into a despotic rule. How far is it comparable to Bodin's concept? Discuss."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Does Marxism curb individual freedom in the name of protecting social justice? Discuss."},{"l":"b","m":"15","t":"Can you justify capital punishment for crimes like rape, murder and corruption? Discuss."},{"l":"c","m":"15","t":"Is empowerment of women a sufficient means to their equal rights to land, property and divorce? Discuss in the context of religious sanctions."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Evaluate the concept of social development as rooted in ethical principles against the concept of social progress being based on economic and political ideals."},{"l":"b","m":"15","t":"How far do Marx, Gandhi and Amartya Sen agree and disagree on the concept of justice in Indian democracy? Discuss."},{"l":"c","m":"15","t":"Will a severe punishment for crimes against women change the mind-set of society? Justify your position."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Does a committed religious person go against social morality? Discuss from the moral perspective."},{"l":"b","m":"10","t":"How do you define a non-theological concept of evil? Explain."},{"l":"c","m":"10","t":"Is God necessary for religion? Justify your answer."},{"l":"d","m":"10","t":"Discuss whether the doctrine of immortality of the soul is indispensable for a religion."},{"l":"e","m":"10","t":"Critically discuss the relationship of man with God in the Yoga system of philosophy."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Is there an essential difference between the concept of Liberation in theological and non-theological approaches to life? Discuss."},{"l":"b","m":"15","t":"Does religion guarantee absolute truth? Discuss in the context of religious pluralism."},{"l":"c","m":"15","t":"Compare and contrast the different forms of cosmological argument."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Is the language of analogies more confusing and the language of symbols more unintelligible? Evaluate it in the case of religious language."},{"l":"b","m":"15","t":"What will be the authority and acceptance of absolute ethical values in a non-theological system of social practices? Discuss."},{"l":"c","m":"15","t":"Discuss whether the voluntarist's theories of faith are adequate."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"Can a religious person take an elastic view about religious ideals, principles and practices which are supposed to be eternal? Will it make the religion progressive or will it demolish its authority? Discuss critically."},{"l":"b","m":"15","t":"What is a non-theological concept of God? How is it different from a theological concept of God? Discuss with arguments."},{"l":"c","m":"15","t":"In order to make expressions of religious experiences communicable, what kind of language needs to be constructed and used? Explain."}]}]},{"year":2016,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"What is the logical necessity for Locke to introduce the concept of secondary qualities? Give reasons for your answer."},{"l":"b","m":"10","t":"Examine Kant's criticism of Descartes' view of Self."},{"l":"c","m":"10","t":"Why does Wittgenstein reject the possibility of private language?"},{"l":"d","m":"10","t":"Explain verification theory. Does it lead to elimination of metaphysics?"},{"l":"e","m":"10","t":"Discuss Quine's attack on the analytic-synthetic distinction."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Does Aristotle treat matter as a 'Substance'? Give reasons for your answer."},{"l":"b","m":"15","t":"Critically examine Hume's views on the relation of cause and effect."},{"l":"c","m":"15","t":"Discuss Sartre's notion of 'Nothingness'."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Does Plato's 'Theory of Form' explain the 'change' and 'sensibility' of matter? Give reasons for your answer."},{"l":"b","m":"15","t":"What, according to Kant, are 'pure concepts'? Examine their role in the process of knowing."},{"l":"c","m":"15","t":"Explain Russell's view that \"the physical object is a logical construction from sense-data\". Why does he call his metaphysical view 'neutral monism'?"}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"What, according to Husserl, is the task of a philosopher? Do you think his methods are relevant to philosophy? Discuss."},{"l":"b","m":"15","t":"What is Hegel's view on God? Do you think that his interpretation of God was contributive to colonial and imperial expansionist designs? Explain."},{"l":"c","m":"15","t":"Discuss the various stances on God taken by Rationalists and Empiricists."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Differentiate the concept of 'Kaivalya' as discussed in Jaina and Yoga philosophies."},{"l":"b","m":"10","t":"How does 'Kṣaṇikavāda' strengthen the arguments for 'Nairātmyavāda'? Explain."},{"l":"c","m":"10","t":"Critically examine the role of 'Prakṛti' in the process of evolution."},{"l":"d","m":"10","t":"Examine the Jaina stance of 'Naya'. How does it differ from 'Syādvāda'?"},{"l":"e","m":"10","t":"Evaluate Śaṅkara's position on Īśvara."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Does the 'Doctrine of Dependent Origination' reconcile the two extreme views on the law of causation, namely Satkāryavāda and Asatkāryavāda? Give reasons for your answer."},{"l":"b","m":"15","t":"Can the 'Tattvārtha' theory of Jainism be acceptable for scientific explanations? Explain."},{"l":"c","m":"15","t":"Is the doctrine of 'Self' acceptable in the modern age of science and reason? Examine the view in the light of Indian philosophy."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Discuss Aurobindo's views on 'Evolution' and 'Involution'. How do they differ from traditional Yoga philosophy?"},{"l":"b","m":"15","t":"What would be Cārvāka's view on Vyāpti? Can this view be acceptable to the Naiyāyikas? Give reasons for your answer."},{"l":"c","m":"15","t":"What is the logical necessity for the Mīmāṁsakas to treat 'Arthāpatti' as an independent Pramāṇa? Discuss."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"How do the Naiyāyikas justify the introduction of 'Abhāva' as an independent category? Explain."},{"l":"b","m":"15","t":"What are Kleśas? How can these be eliminated? Explain."},{"l":"c","m":"15","t":"Give a critical exposition of the concept of 'Brahman' as discussed by Śaṅkara, Rāmānuja and Madhva."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"\"Sovereignty is the supreme power over citizens and subjects, unrestrained by law.\" Discuss."},{"l":"b","m":"10","t":"A well-ordered society, according to Rawls, is effectively regulated by a public conception of justice. Do you agree? Give reasons."},{"l":"c","m":"10","t":"\"Socialism itself is the fulfilment of democracy.\" Analyse."},{"l":"d","m":"10","t":"Evaluate the statement that all human beings have certain unalienable rights."},{"l":"e","m":"10","t":"\"The goal in punishing should be to reform the individual.\" Comment."}]},{"n":2,"s":"A","p":[{"l":"a","m":"15","t":"Is liberty a positive and equal opportunity of self-realization? Discuss."},{"l":"b","m":"15","t":"On what grounds does Laski criticize Austin's concept of sovereignty?"},{"l":"c","m":"20","t":"\"The right of free speech implies the genuine independence of the judiciary and its complete separation from the executive.\" Evaluate."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Is the State an agency for expressing the will of the ruling classes? Examine."},{"l":"b","m":"15","t":"Can we consider \"freedom from domination\" as one of the justifications for multiculturalism? Give reasons for your answer."},{"l":"c","m":"15","t":"Is it possible to measure social progress independent of economic development? Discuss."}]},{"n":4,"s":"A","p":[{"l":"a","m":"15","t":"\"To me the female sex is not the weaker sex. It is the nobler of the two.\" Evaluate this statement of Gandhi."},{"l":"b","m":"15","t":"Do you agree that women become empowered through collective reflection and decision-making? Discuss."},{"l":"c","m":"20","t":"How did Ambedkar analyse the caste system from historical and social perspectives? Explain."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Critically discuss the view that 'modern sensibility and total obedience to a despotic God' do not go hand in hand."},{"l":"b","m":"10","t":"\"World-religion is a spiritualistic and humanistic composite.\" Evaluate."},{"l":"c","m":"10","t":"Is religious absolutism a threat to religious pluralism? Discuss."},{"l":"d","m":"10","t":"Buddhism disbelieves in the immortality of the soul, but accepts the phenomenon of rebirth. Examine."},{"l":"e","m":"10","t":"Faith means human awareness of God; but it cannot be irrational. Analyse."}]},{"n":6,"s":"B","p":[{"l":"a","m":"15","t":"The content of revelation is a body of truths expressed in statements or propositions. But it cannot be against reason. Discuss."},{"l":"b","m":"20","t":"Compare and contrast the relation of man to the world in the oriental religions."},{"l":"c","m":"15","t":"Show how the attributes of immanence and transcendence of God go with omnipresence and infinitude."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"State and evaluate the nature and validity of mystic experience."},{"l":"b","m":"15","t":"\"Moral principles function better when they remain independent and unconnected with religion.\" Discuss."},{"l":"c","m":"15","t":"\"It would be self-contradictory to say that the most perfect conceivable being lacks the attribute of existence.\" Analyse."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"\"If God is all-powerful, God must wish to abolish all evils; but moral and natural evils are rampant in the world.\" How would a theist react to this?"},{"l":"b","m":"15","t":"Among the different views of religious language, which one is more satisfactory and why?"},{"l":"c","m":"15","t":"\"The natural world is as complexly and manifestly designed as a watch.\" Evaluate."}]}]},{"year":2015,"one":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"Aristotle's distinction between 'actuality' and 'potentiality'."},{"l":"b","m":"10","t":"Esse est percipi."},{"l":"c","m":"10","t":"Husserl's notion of 'bracketing'."},{"l":"d","m":"10","t":"Strawson's distinction between 'M' and 'P' predicates."},{"l":"e","m":"10","t":"G. E. Moore's refutation of idealism."}]},{"n":2,"s":"A","p":[{"l":"a","m":"20","t":"Explain Kant's division of categories."},{"l":"b","m":"15","t":"Discuss why Heidegger introduces the concept of Dasein in his metaphysics."},{"l":"c","m":"15","t":"Elucidate Quine's arguments to show that analyticity is not synonymity."}]},{"n":3,"s":"A","p":[{"l":"a","m":"20","t":"Bring out the relationship between language games and forms of life."},{"l":"b","m":"15","t":"Explain Leibniz's principle of the 'identity of indiscernibles'."},{"l":"c","m":"15","t":"What do we understand by incomplete symbols? What role do they play in Russell's theory of meaning? Discuss."}]},{"n":4,"s":"A","p":[{"l":"a","m":"20","t":"Explain Plato's theory of forms. Does it entail a kind of essentialism? Discuss."},{"l":"b","m":"15","t":"Does Descartes' Cogito principle entail that he is an essentialist? Discuss."},{"l":"c","m":"15","t":"Bring out the relationship between existence and essence in the case of human beings. Explain the issues it gives rise to for human beings according to Sartre."}]},{"n":5,"s":"B","p":[{"l":"a","m":"10","t":"Pañcavidhabheda."},{"l":"b","m":"10","t":"The Jaina concept of Dravya."},{"l":"c","m":"10","t":"Ālayavijñāna."},{"l":"d","m":"10","t":"Satkāryavāda."},{"l":"e","m":"10","t":"Sri Aurobindo's Integral Yoga."}]},{"n":6,"s":"B","p":[{"l":"a","m":"20","t":"Elaborate the Nyaya-Mīmāṁsā debate on Prāmāṇyavāda."},{"l":"b","m":"15","t":"\"Our knowledge is confined to guṇas alone.\" Examine this statement in the light of the Vaiśeṣika and Buddhist controversy."},{"l":"c","m":"15","t":"Is anyathākhyātivāda an adequate explanation of error? Elaborate."}]},{"n":7,"s":"B","p":[{"l":"a","m":"20","t":"Compare and contrast the notion of Brahman in Śaṅkara and Rāmānuja."},{"l":"b","m":"15","t":"State and examine the Sāṁkhya proofs for the existence of Puruṣa."},{"l":"c","m":"15","t":"Explain the arguments of Cārvāka to reject transcendental entities."}]},{"n":8,"s":"B","p":[{"l":"a","m":"20","t":"What is bondage according to Yoga philosophy? Explain the method of attaining Kaivalya in Patañjali's Yogasūtra."},{"l":"b","m":"15","t":"What do Saṁvara and Nirjarā mean? Explain their significance in the Jaina theory of liberation."},{"l":"c","m":"15","t":"What is the role of Pratītyasamutpāda in explaining Duḥkha? Elucidate the means to overcome it."}]}],"two":[{"n":1,"s":"A","p":[{"l":"a","m":"10","t":"\"Equality does not mean treating everyone equal.\" Discuss."},{"l":"b","m":"10","t":"Is civil disobedience in a democratic State justifiable? Discuss."},{"l":"c","m":"10","t":"Explain Harold Laski's critique of sovereignty."},{"l":"d","m":"10","t":"How are individual and group rights reconciled in democracy? Explain."},{"l":"e","m":"10","t":"\"Inequitable development leads to social conflicts rather than social progress.\" Explain."}]},{"n":2,"s":"A","p":[{"l":"a","m":"15","t":"What does gender discrimination mean? Is it not a violation of equality and social justice? Discuss."},{"l":"b","m":"15","t":"Does economic empowerment of women eliminate gender discrimination? Discuss."},{"l":"c","m":"20","t":"Evaluate Ambedkar's critique of the caste system."}]},{"n":3,"s":"A","p":[{"l":"a","m":"15","t":"Is multiculturalism a need of global society? Discuss."},{"l":"b","m":"15","t":"\"The aim of punishment is to defend the moral law and to do justice to the criminal.\" Discuss."},{"l":"c","m":"20","t":"Evaluate the nature and functions of parliamentary democracy."}]},{"n":4,"s":"A","p":[{"l":"a","m":"15","t":"\"Man must grow materially as well as spiritually.\" Evaluate this statement of Ambedkar."},{"l":"b","m":"15","t": function partPage(slug){
  const p = part(slug); if(!p) return notFound();
  document.body.dataset.part = slug;
  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a> · ${p.paper}</div>
    <h1 class="title">${p.name}</h1>
    <div class="band"></div>
    <p class="sub" style="max-width:36rem">${p.blurb}</p>
    <div class="list">
      ${p.topics.map(t=>`
        <a class="item" href="#/topic/${p.slug}/${t.n}">
          <span class="n">${t.n}</span>
          <span><h3>${t.title}</h3><p>${t.syl}</p></span>
          ${t.content.trim()?'':'<span class="status">No notes yet</span>'}
        </a>`).join('')}
    </div>
  </div></section>`;
}

function topicPage(slug,n){
  const p = part(slug); if(!p) return notFound();
  const i = p.topics.findIndex(t=>String(t.n)===String(n));
  if(i<0) return notFound();
  const t = p.topics[i], prev = p.topics[i-1], next = p.topics[i+1];
  document.body.dataset.part = slug;
  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a> · <a href="#/part/${p.slug}">${p.name}</a></div>
    <h1 class="title read">${t.title}</h1>
    <div class="band"></div>
    <div class="syl-box read"><span>Syllabus</span>${t.syl}</div>
    <div class="note">
      ${t.content.trim() || `<div class="empty"><b>Notes for this topic aren’t up yet.</b>They’re being written and will appear here.</div>`}
    </div>
    <div class="pager read">
      ${prev?`<a href="#/topic/${p.slug}/${prev.n}"><small>Previous</small>${prev.title}</a>`:'<span></span>'}
      ${next?`<a href="#/topic/${p.slug}/${next.n}" style="text-align:right"><small>Next</small>${next.title}</a>`:'<span></span>'}
    </div>
  </div></section>`;
}

function syllabus(){
  const group = (title,slugs)=>slugs.map(s=>{
    const p = part(s);
    return `<div class="syl-part" style="--c:${p.color}">
      <h3>${p.name}</h3>
      <ol start="${p.topics[0].n}">
        ${p.topics.map(t=>`<li><b>${t.title}:</b> ${t.syl}</li>`).join('')}
      </ol></div>`;
  }).join('');

  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a></div>
    <h1 class="title">Syllabus</h1>
    <div class="band"></div>
    <p class="sub">The Philosophy optional as notified by the Union Public Service Commission. Each entry links to its notes from the part pages.</p>

    <div class="syl-paper">
      <h2>Paper I — History and Problems of Philosophy</h2>
      <p class="note-line">Twenty topics: eleven Western, nine Indian.</p>
      ${group('Paper I',['western','indian'])}
    </div>

    <div class="syl-paper">
      <h2>Paper II</h2>
      <p class="note-line">Two sections of ten topics each.</p>
      ${group('Paper II',['socio','religion'])}
    </div>
  </div></section>`;
}

function qCount(list){ return list.reduce((a,q)=>a+q.p.length,0); }

function papers(){
  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a></div>
    <h1 class="title">Previous year papers</h1>
    <div class="band"></div>
    <p class="sub">Every Philosophy question asked in the Civil Services Mains from 2013 onwards \u2014 both papers, all parts, with marks. Pick a year.</p>
    <div class="years">
      ${PAPERS.map(y=>{
        const c = qCount(y.one) + qCount(y.two);
        return `<a class="year" href="#/paper/${y.year}"><b>${y.year}</b><small>${c?c+' questions':'Not added yet'}</small></a>`;
      }).join('')}
    </div>
  </div></section>`;
}

function questionBlocks(list){
  let out = '', sec = '';
  list.forEach(q=>{
    if(q.s !== sec){ sec = q.s; out += `<div class="qsec">Section ${sec}</div>`; }
    out += `<div class="qblock"><span class="qn">${q.n}</span><ol class="parts">${
      q.p.map(p=>`<li><span class="pl">(${p.l})</span><span class="pt">${p.t}</span><span class="pm">${p.m}</span></li>`).join('')
    }</ol></div>`;
  });
  return out;
}

function paperYear(year){
  const y = PAPERS.find(p=>String(p.year)===String(year)); if(!y) return notFound();
  const i = PAPERS.indexOf(y), prev = PAPERS[i+1], next = PAPERS[i-1];
  const block = (name,list)=>`<div class="qpaper"><h2>${name}</h2>${
    list.length ? questionBlocks(list)
                : `<div class="empty"><b>Questions aren\u2019t up yet.</b>This paper will be added soon.</div>`}</div>`;
  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a> \u00b7 <a href="#/papers">Past papers</a></div>
    <h1 class="title">Philosophy ${y.year}</h1>
    <div class="band"></div>
    <p class="sub">${qCount(y.one)+qCount(y.two)} questions. Answer five in all; questions 1 and 5 are compulsory, and at least one question from each section.</p>
    ${block('Paper I', y.one)}
    ${block('Paper II', y.two)}
    <div class="pager">
      ${next?`<a href="#/paper/${next.year}"><small>Next year</small>Philosophy ${next.year}</a>`:'<span></span>'}
      ${prev?`<a href="#/paper/${prev.year}" style="text-align:right"><small>Previous year</small>Philosophy ${prev.year}</a>`:'<span></span>'}
    </div>
  </div></section>`;
}

function notFound(){
  return `<section class="page"><div class="wrap read">
    <h1 class="title">Page not found</h1>
    <div class="band"></div>
    <p>That link doesn’t point anywhere on this site. <a href="#/">Go back to the home page</a>.</p>
  </div></section>`;
}

/* ---------------- router ---------------- */
function render(){
  const path = (location.hash.replace(/^#\/?/,'') || '').split('/').filter(Boolean);
  document.body.dataset.part = '';
  let html, key = '';
  if(path[0]==='part'){ html = partPage(path[1]); key = path[1]; }
  else if(path[0]==='topic'){ html = topicPage(path[1],path[2]); key = path[1]; }
  else if(path[0]==='syllabus'){ html = syllabus(); key='syllabus'; }
  else if(path[0]==='papers'){ html = papers(); key='papers'; }
  else if(path[0]==='paper'){ html = paperYear(path[1]); key='papers'; }
  else if(path.length===0){ html = home(); }
  else html = notFound();

  $('#app').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===key));
  $('#nav').classList.remove('open');
  $('#res').classList.remove('open'); $('#q').value='';
  window.scrollTo(0,0);
}
addEventListener('hashchange', render);

);

  const box = $('#res');
  if(v.length<2){ box.classList.remove('open'); return; }
  const hits = INDEX.filter(x=>(x.title+' '+x.syl+' '+x.part).toLowerCase().includes(v)).slice(0,14);
  box.innerHTML = hits.length
    ? hits.map(h=>`<a href="${h.href}" style="--c:${h.color}"><b>${esc(h.title)}</b><span>${esc(h.part)}</span></a>`).join('')
    : `<div class="none">No topic matches that.</div>`;
  box.classList.add('open');
});
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) $('#res').classList.remove('open'); });

/* ---------------- visit counter ----------------
   Counts every time the site is opened and keeps the running
   total. When you host this yourself, swap the store below for
   a counter service (GoatCounter, CountAPI) so the number is
   shared across all visitors.                                  */
async function countVisit(){
  const out = $('#visits');
  const show = n => out.textContent = n.toLocaleString('en-IN');
  const KEY = 'darsana:visits';
  try{
    if(window.storage){
      let n = 0;
      try{ const r = await window.storage.get(KEY, true); n = parseInt(r && r.value, 10) || 0; }catch(_){}
      n += 1;
      await window.storage.set(KEY, String(n), true);
      show(n); return;
    }
  }catch(_){}
  try{
    const n = (parseInt(window.localStorage.getItem(KEY),10) || 0) + 1;
    window.localStorage.setItem(KEY, String(n));
    show(n);
  }catch(_){ show(1); }
}

render();
countVisit();
</script>
