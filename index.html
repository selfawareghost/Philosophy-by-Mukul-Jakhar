acities merely waiting for some entirely external trigger, but are actively, internally oriented toward their own specific actualization.</p><blockquote class=\"hook\">Aristotle's Physics locates the primary reason for developmental change in Physis (nature) — an internal principle of motion belonging to a thing in virtue of itself, distinguishing natural substances (whose development is internally driven, like an acorn's inherent tendency to grow into an oak) from artifacts (whose form is externally imposed with no inherent developmental tendency).</blockquote><p>B. The Four Causes, working jointly: recall Topic 3's material — complete explanation of any developmental change requires all four causes operating together: the Material Cause (the underlying substratum undergoing change), the Formal Cause (the specific structure toward which the change tends), the Efficient Cause (the specific agent or trigger actually initiating the change — parent organisms, environmental conditions, a craftsman), and the Final Cause (the purpose or end-state, Telos, the change is ultimately oriented toward). Developmental change specifically involves all four operating in a coordinated, non-accidental sequence — the acorn's material composition, its formal potential for oak-structure, the efficient causes (soil, water, sunlight) actually triggering growth, and the final cause (mature oak-hood) toward which the entire process is oriented, together explain why and how the change occurs as it does.</p><blockquote class=\"hook\">Developmental change is fully explained only by all Four Causes operating jointly and non-accidentally: the material substratum undergoing change, the formal structure the change tends toward, the efficient causes actually triggering the process, and the final cause (Telos) the entire development is oriented toward — an acorn's growth into an oak requires citing all four to be genuinely, completely explained.</blockquote><p>C. Teleology — change as goal-directed, not random: Aristotle holds that natural developmental change is characteristically teleological — oriented toward a specific end or purpose (the mature, fully-actualized form of the organism) — rather than being a merely random, undirected sequence of events. This is precisely why the same kind of seed reliably, predictably develops into the same kind of mature organism (acorns reliably become oaks, not randomly becoming oaks sometimes and something else other times) — the developmental process is not accidental but is oriented, from the start, toward the specific actuality that constitutes that organism's own proper, natural fulfilment.</p><blockquote class=\"hook\">Developmental change is characteristically teleological, not random — oriented from the start toward a specific end constituting the organism's proper, natural fulfilment, which is precisely why acorns reliably develop into oaks rather than randomly becoming any of countless other things, since the entire process is goal-directed toward that specific actuality.</blockquote><h4>Causation as an Ongoing Process — What This Means Precisely</h4><p>Worth setting up the precise content for the 2022 PYQ's identity-question: Aristotle's account of change treats causation not as a series of discrete, disconnected \"snapshot\" events, but as a continuous, unified process — the acorn's growth into an oak is not a sequence of separate, unrelated transformations (acorn, then seedling, then sapling, then mature tree, as though each were a wholly new, unconnected substance replacing the last) but a single, continuous developmental process, unified by its orientation toward one specific Telos, undergone by one and the same persisting subject throughout.</p><h4>Testing Consistency — Does Process-Causation Cohere With Persisting Identity?</h4><p>This is the precise critical content the 2022 PYQ demands, requiring genuine philosophical scrutiny.</p><p>The apparent tension: if a substance is constantly changing — undergoing continuous developmental process, with its properties, size, and even (in the acorn-to-oak case) its overall structure radically transforming over time — in what sense is it correct to say this is one and the same substance persisting throughout, rather than a series of numerically different things replacing one another in succession (this echoes precisely the kind of identity-through-change puzzle built extensively in the Buddhism preparation's Ksanikavada material)?</p><p>Aristotle's resolution — appealing directly to Hylomorphism (Topic 3): what secures persisting identity through change is precisely the continuous persistence of the same underlying matter, informed successively by a developing, but continuously-related, sequence of forms, all oriented toward one and the same Telos. The acorn and the mature oak are the same individual substance not because nothing about them changes (nearly everything observable does change) but because there is a continuous, unbroken material and formal-developmental continuity connecting every stage — the very same matter persists throughout (suitably transformed and supplemented via nutrition, but never entirely discontinuous), and the formal development at each stage is not arbitrary or random but is the specific, orderly unfolding of potentialities already really present in the earlier stages, oriented toward the single, same Telos throughout.</p><blockquote class=\"hook\">Aristotle's identity-through-change resolution appeals directly to Hylomorphism: persisting identity is secured not by nothing changing, but by continuous material persistence (the same underlying matter, suitably transformed via nutrition, never entirely discontinuous) combined with orderly, non-arbitrary formal development — each stage's form being the specific unfolding of potentialities already really present at the earlier stage, all oriented toward one and the same Telos throughout, rather than a series of numerically distinct substances randomly replacing one another.</blockquote><h4>Is This Resolution Fully Successful? — A Critical Note</h4><p>Worth a closing, appropriately measured evaluative point, since \"is it in consonance\" invites genuine critical engagement: this resolution is considerably more successful than accounts (like extreme Heraclitean flux, or Buddhist Ksanikavada's radical momentariness) that deny persisting identity altogether, since Aristotle's framework gives a principled account of why certain sequences of change count as the \"same\" persisting thing (continuous matter plus orderly, Telos-oriented formal development) rather than treating this as a brute, unexplained assumption. A residual difficulty worth noting: the notion of \"continuous\" material persistence itself may admit of borderline or vague cases (exactly how much matter can be gradually replaced through an organism's life — nutrition, cell replacement — before we'd hesitate to call it \"the same\" underlying matter?), a version of the classical Ship of Theseus puzzle that Aristotle's framework doesn't fully, explicitly resolve, even while providing considerably more explanatory resources than rival accounts that simply deny diachronic identity altogether.</p><blockquote class=\"hook\">Aristotle's account is considerably more successful than views denying persisting identity altogether, since it provides a principled explanation (continuous matter plus orderly, Telos-oriented formal development) rather than treating sameness-through-time as a brute assumption — though it leaves a residual, Ship-of-Theseus-style difficulty about exactly how much gradual material replacement is compatible with genuine continuity, a vagueness the framework doesn't fully, explicitly resolve.</blockquote><div class=\"refined\"><h4>Refined notes</h4><p>Substances undergo developmental change for three converging reasons: (1) Physis (nature) — an internal principle of motion belonging to natural substances (unlike externally-formed artifacts), driving self-directed development; (2) the Four Causes operating jointly — material, formal, efficient, and final causes together, non-accidentally, explain any developmental process; (3) teleology — development is goal-directed toward a specific Telos (proper fulfilment), not random, explaining reliable, predictable developmental patterns (acorns→oaks). Causation as process: change is a continuous, unified developmental sequence, not disconnected snapshot-events. Consistency with persisting identity: Aristotle secures identity-through-change via Hylomorphism — continuous material persistence (suitably transformed via nutrition, never discontinuous) plus orderly, non-arbitrary formal development (each stage unfolding potentialities really present earlier, oriented toward one Telos) — not \"nothing changes,\" but a principled account of what makes changing stages count as one persisting substance. Critical note: more successful than views denying identity altogether (contrast Buddhist Ksanikavada), but leaves a residual, Ship-of-Theseus-style vagueness about exactly how much gradual material replacement remains compatible with genuine continuity.</p><blockquote class=\"hook\">One-line exam hook: Substances develop because of Physis (internal, self-directed change, unlike artifacts), the Four Causes working jointly, and teleology (goal-directed toward a specific Telos) — and this process-causation is consistent with persisting identity because Hylomorphism secures sameness through continuous matter plus orderly, Telos-oriented formal development, not through nothing changing, though a residual Ship-of-Theseus vagueness about gradual material replacement remains unresolved.</blockquote><p class=\"kw\"><span>Keywords</span>Physis (internal principle, vs external artifact-formation), Four-Causes-jointly, teleology (goal-directed, not random), causation-as-continuous-process, Hylomorphic-identity-resolution (continuous matter + orderly formal development + one Telos), Ship-of-Theseus residual vagueness, contrast with Buddhist Ksanikavada</p></div><article class=\"answer\" id=\"ans-2019-1-2-b\"><div class=\"answer-tag\">Model answer · 2019 · Paper I · Q2(b) · 15 marks</div><p class=\"answer-q\">What are the reasons for developmental changes in substance according to Aristotle? Discuss.</p><p>For Aristotle, developmental change in substances is neither random nor externally imposed alone — it follows from several converging, mutually reinforcing explanatory principles.</p><h4>Physis: An Internal Principle of Change</h4><p>Aristotle's Physics defines nature (Physis) specifically as an internal source or principle of motion and rest belonging to a thing in virtue of itself. This distinguishes natural substances from artifacts: a bed or table has its form imposed entirely from outside by a craftsman and possesses no inherent tendency to develop further as a bed. Natural substances — plants, animals — by contrast, possess an internal principle driving their own development. An acorn does not require external compulsion to grow into an oak; the tendency toward this specific developmental outcome is built into the acorn's own nature, as an expression of its own inherent form. This is the primary reason developmental change occurs: potentialities within natural substances are actively, internally oriented toward their own actualization, not inert capacities awaiting a purely external trigger.</p><h4>The Four Causes, Operating Jointly</h4><p>Complete explanation of any developmental change requires all Four Causes operating together: the Material Cause (the underlying substratum undergoing change), the Formal Cause (the specific structure the change tends toward), the Efficient Cause (the specific agent or trigger actually initiating the process — soil, water, sunlight, for the acorn), and the Final Cause (the purpose or end-state, Telos, the process is ultimately oriented toward — mature oak-hood). Developmental change specifically requires all four working in coordinated, non-accidental sequence, not any single cause operating in isolation.</p><h4>Teleology: Goal-Directedness</h4><p>Underlying both these explanations is Aristotle's teleological commitment: natural developmental change is characteristically oriented toward a specific end or purpose — the organism's own proper, natural fulfilment — rather than being a merely random, undirected sequence. This is precisely why the same kind of seed reliably, predictably develops into the same kind of mature organism: acorns reliably become oaks, not randomly becoming any of countless other things, because the entire developmental process is goal-directed from the start toward that specific actuality.</p><h4>Conclusion</h4><p>Developmental change in Aristotle's system is thus explained through the convergence of an internal, self-directing principle (Physis), the joint operation of all Four Causes, and an underlying teleological orientation toward a determinate end — together explaining not merely that substances change, but why they change in the specific, orderly, predictable manner they characteristically do.</p><button class=\"to-top\" data-jump=\"topic-top\">Back to contents</button></article><article class=\"answer\" id=\"ans-2022-1-2-b\"><div class=\"answer-tag\">Model answer · 2022 · Paper I · Q2(b) · 15 marks</div><p class=\"answer-q\">Is Aristotle's view of the nature of identity in consonance with his metaphysical view of causes as processes? Discuss giving suitable examples.</p><p>Aristotle treats causation not as a series of discrete, disconnected events, but as a continuous, unified developmental process — raising a genuine question: does this processual view of causation cohere with his claim that a substance retains a single, persisting identity throughout that very process of change?</p><h4>The Apparent Tension</h4><p>If a substance is constantly changing — as an acorn undergoes continuous, radical transformation into a seedling, sapling, and finally a mature oak — in what sense is this one and the same substance persisting throughout, rather than a series of numerically distinct things replacing one another in succession? This is a genuine philosophical difficulty, structurally similar to identity-through-change puzzles found elsewhere in the history of philosophy, including Buddhist momentariness (Ksanikavada), which denies persisting substantial identity altogether precisely because of this kind of continuous change.</p><h4>Aristotle's Resolution: Hylomorphic Continuity</h4><p>Aristotle resolves this tension by appealing directly to his doctrine of Form and Matter. Persisting identity is secured not by the absence of change — nearly everything observable about the acorn does change — but by two continuous threads running through the entire process: first, the continuous persistence of the same underlying matter, suitably transformed and supplemented through nutrition, but never entirely discontinuous or replaced wholesale at any point; second, orderly, non-arbitrary formal development, where each stage's specific form is the genuine unfolding of potentialities already really present at the earlier stage, not an arbitrary or random alteration. Crucially, this entire developmental sequence is oriented toward one and the same Telos — mature oak-hood — throughout, giving the process a unifying directionality that random or disconnected change would lack.</p><h4>Evaluating the Consonance</h4><p>This account is genuinely consonant with Aristotle's processual view of causation: the very features that make causation a coherent, unified process (continuous material substratum, orderly formal succession, single Telos) are precisely what secure persisting identity through that process. The two doctrines are not merely compatible but mutually supporting — process-causation without persisting identity would be arbitrary, disconnected change, while persisting identity without process-causation would be static, unexplained sameness.</p><h4>A Residual Difficulty</h4><p>However, a residual difficulty remains: exactly how much gradual material replacement — through nutrition, growth, cell turnover — is compatible with genuine material continuity before we would hesitate to call it \"the same\" underlying matter? This is a version of the classical Ship of Theseus puzzle, which Aristotle's framework does not fully, explicitly resolve, even while providing considerably more explanatory resources than views (such as Ksanikavada) that deny diachronic identity altogether.</p><h4>Conclusion</h4><p>Aristotle's view of identity is thus substantially in consonance with his metaphysics of causation as process — the same Hylomorphic apparatus (continuous matter, orderly formal development, unifying Telos) that explains causal process also explains persisting identity through that process — though a residual vagueness about the precise limits of material continuity remains an open, unresolved question within the framework itself.</p><button class=\"to-top\" data-jump=\"topic-top\">Back to contents</button></article>"},{"id":"comp-1","title":"1. The Logical Consistency of Plato's Idea-World Relation, and Aristotle's Alternative","group":"Part III — Plato and Aristotle Compared","html":"<h4>Restating the Question Precisely</h4><p>The question has two parts: (1) Is the relation Plato posits between the Forms (Ideas) and the sensible World logically consistent? (2) What does Aristotle say about this relation, and do his arguments give grounds for a reasoned verdict? This is not simply \"explain Plato's theory\" or \"explain Aristotle's critique\" separately — it demands genuine adjudication, using everything built across both systems.</p><h4>Recap — The Precise Relation Being Tested</h4><p>Recall Part I, Topic 5 directly: Plato holds particulars relate to Forms through Methexis (participation) — particulars are transcendent Forms' immanent, imperfect copies. The consistency question asks whether this specific relational claim — a particular thing \"participating in\" a wholly separate, transcendent Form — can be coherently, non-contradictorily maintained.</p><h4>The Case for Inconsistency — Aristotle's Cluster of Objections</h4><p>This is where Parts I and II converge — worth assembling every relevant objection already built into one coherent critical case.</p><p>A. The Third Man Argument (recall Part I, Topics 3 and 5): if a particular large thing is large by participating in the Form of Largeness, and the Form of Largeness must itself be large (to serve as the standard), then the Form and the particular sharing this quality would seem to require a further, higher Form of Largeness explaining their shared largeness — and this regress never terminates. This isn't merely an inconvenient complication; it's a formal, logical inconsistency in the theory's own structure, since the same reasoning that establishes the first Form's existence, applied consistently, generates an infinite series the theory has no principled way to stop.</p><p>B. Chorismos and the explanatory failure (recall Part II, Topic 1 directly): Aristotle's core objection is that separation (Chorismos) makes Forms causally and explanatorily inert — a Form existing \"elsewhere,\" ontologically detached from the particular, cannot coherently explain that particular's actual properties, generation, or change (recall Part I, Topic 6's change-explanation difficulties directly). If Forms cannot do the very explanatory work Plato posits them to do, the participation relation is, at minimum, explanatorily empty, even if not narrowly self-contradictory — it fails to deliver on its own stated purpose.</p><p>C. The \"third thing\" problem — what, exactly, IS participation? A further, sharper logical difficulty: \"participation\" is meant to be the relation connecting particulars to Forms — but what kind of thing is this relation itself? If participation is some further entity or reality distinct from both the particular and the Form, this relation itself would seem to require its own further, connecting relation to link IT to the particular and the Form it relates — threatening a second, structurally similar regress (recall this precise style of objection from the Nyaya-Vaiśeṣika preparation's Samavāya-regress material). Plato's own Parmenides raises versions of exactly this difficulty without providing a fully satisfying resolution.</p><blockquote class=\"hook\">Aristotle's cluster of objections mounts a genuine case for inconsistency: the Third Man Argument shows the participation-relation, applied consistently, generates an unstoppable infinite regress; Chorismos renders Forms causally inert, unable to do the explanatory work Plato requires of them; and the \"third thing\" problem asks what kind of entity participation itself is, threatening a further regress structurally similar to Nyaya-Vaiśeṣika's own Samavāya difficulties — together suggesting the Idea-World relation is not merely imperfectly explained but formally, logically unstable.</blockquote><h4>Aristotle's Alternative — Does It Actually Resolve the Difficulty, or Merely Avoid It?</h4><p>Worth the crucial second-order question, since simply having a different theory doesn't automatically prove the first theory inconsistent: recall Part II, Topics 1 and 3 directly — Aristotle's Hylomorphism relocates form immanently, within the particular itself; there is no separate, transcendent Form for a particular to \"participate in\" from a distance; form and matter jointly, immediately constitute the one concrete substance. This move directly dissolves the Third Man regress (there's no separate Form of Largeness needing to itself be large, since \"largeness\" is simply this particular's own immanent form, not a further, shared, separately-existing entity) and dissolves Chorismos's explanatory failure (form, being immanent, can straightforwardly serve as the Formal Cause of the very particular it structures).</p><blockquote class=\"hook\">Aristotle's Hylomorphic alternative directly dissolves these difficulties by relocating form immanently: there's no separate Form of Largeness needing to itself be large (dissolving the Third Man regress), and form, being immanent within the particular, can straightforwardly serve as that particular's own Formal Cause (dissolving Chorismos's explanatory failure) — the alternative doesn't merely avoid Plato's problems by asserting something different, but specifically targets and resolves the precise structural features generating them.</blockquote><h4>A Balanced, Reasoned Verdict</h4><p>The strongest case for genuine inconsistency, not merely incompleteness: the Third Man Argument is not a matter of Plato's theory being merely under-specified or incomplete — it's generated by the theory's own internal logic, applied consistently (if largeness-in-particulars requires explanation via a Form, and the Form is itself large, parity of reasoning demands the same explanation be applied to the Form too). A theory whose own core explanatory principle, applied consistently to itself, generates an infinite, unstoppable regress has a genuine logical instability, not merely an explanatory gap.</p><p>A fair qualification, however: Plato's own texts (the Parmenides especially) show he was aware of, and grappled seriously with, exactly these difficulties — this suggests the theory, at least in its most naive, unqualified form, is genuinely inconsistent, but leaves open whether a more sophisticated, qualified version of Platonism (distinguishing, perhaps, the sense in which the Form of Largeness is \"large\" from the sense in which particulars are) might escape the regress — a question later Platonist commentators spent considerable effort addressing, beyond what the syllabus requires you to resolve definitively.</p><blockquote class=\"hook\">The strongest case favours genuine logical inconsistency, not merely incompleteness: the Third Man regress follows from the theory's own core explanatory principle applied consistently to itself, a structural instability rather than a mere explanatory gap — though Plato's own awareness of the difficulty (in the Parmenides) leaves open whether a more sophisticated, qualified restatement might escape the regress, a question Aristotle's immanent alternative sidesteps entirely by relocating form within the particular from the start.</blockquote><div class=\"refined\"><h4>Refined notes</h4><p>The consistency question tests whether Plato's Methexis-based relation between transcendent Forms and particulars is logically coherent. The case for inconsistency: (1) the Third Man Argument — the same reasoning explaining particulars' shared qualities via Forms, applied to the Form itself, generates an infinite regress; (2) Chorismos — separation renders Forms causally and explanatorily inert, unable to do the work Plato requires; (3) the \"third thing\" problem — participation itself, as a relation, threatens a further regress (parallel to Nyaya-Vaiśeṣika's Samavāya difficulties). Aristotle's Hylomorphism directly dissolves both the Third Man regress (no separate Form needing to itself instantiate the quality) and Chorismos's failure (immanent form serves directly as Formal Cause). Verdict: the strongest case favours genuine logical inconsistency, since the Third Man regress follows from the theory's own core principle applied to itself — a structural instability, not mere incompleteness — though Plato's own self-aware grappling (Parmenides) leaves room for more sophisticated restatements, a question Aristotle's alternative sidesteps by relocating form within the particular from the outset.</p><blockquote class=\"hook\">One-line exam hook: The Third Man Argument shows Plato's participation-relation, applied consistently to itself, generates an unstoppable infinite regress — a structural instability, not mere incompleteness — which Aristotle's Hylomorphism directly dissolves by relocating form immanently within the particular, so there's no separate Form needing to itself instantiate the very quality it's meant to explain.</blockquote><p class=\"kw\"><span>Keywords</span>Third Man Argument (self-applying regress), Chorismos (explanatory inertness), \"third thing\" problem (participation-relation itself, Samavāya parallel), Hylomorphism dissolves both regresses, verdict: genuine-inconsistency-not-mere-incompleteness</p></div><article class=\"answer\" id=\"ans-2018-1-4-b\"><div class=\"answer-tag\">Model answer · 2018 · Paper I · Q4(b) · 15 marks</div><p class=\"answer-q\">Is the relation between the Idea and the World as discussed by Plato logically consistent? Discuss Aristotle's views regarding this and also give arguments in favour of your answer.</p><p>Plato holds that particulars in the sensible world relate to the transcendent Forms (Ideas) through Methexis — participation: a particular is beautiful, or large, or just, because it participates in the corresponding Form. The question of whether this relation is logically consistent requires examining Aristotle's sustained critique and rendering a reasoned verdict.</p><h4>The Case for Inconsistency</h4><p>Aristotle's cluster of objections mounts a serious case against consistency. The Third Man Argument shows the deepest structural difficulty: if a particular large thing is large by participating in the Form of Largeness, and the Form of Largeness must itself be large — since it serves as the standard largeness is measured against — then the Form and the particulars sharing this quality would seem to require a further, higher Form of Largeness to explain their shared largeness. This regress, once begun, never terminates, since the same reasoning applies at every subsequent level.</p><p>A second objection targets Chorismos (separation) directly: because Forms exist ontologically detached from particulars, \"elsewhere,\" they cannot coherently explain a particular's actual properties, generation, or change — Forms are causally and explanatorily inert precisely because of their separateness, undermining the very purpose participation is meant to serve.</p><p>A third, sharper difficulty concerns the \"third thing\" problem: participation itself is meant to be the relation connecting particulars to Forms, but what kind of entity is this relation? If participation is a further reality distinct from both particular and Form, it would seem to require its own connecting relation to link it to what it relates — threatening a second, structurally similar regress, echoing difficulties found elsewhere in the history of philosophy concerning relations connecting substances to their qualities.</p><h4>Aristotle's Alternative</h4><p>Aristotle's own solution, Hylomorphism, relocates form immanently within the particular substance itself, rather than positing a separate, transcendent entity. There is no separate Form of Largeness needing itself to be large, since \"largeness\" is simply this particular's own immanent form — directly dissolving the Third Man regress. And because form is immanent, it can straightforwardly serve as the particular's own Formal Cause, directly dissolving Chorismos's explanatory failure. Aristotle's alternative does not merely assert a different picture; it specifically targets and resolves the precise structural features generating Plato's difficulties.</p><h4>A Reasoned Verdict</h4><p>The strongest case favours genuine logical inconsistency, not merely explanatory incompleteness. The Third Man regress is not an incidental complication but follows directly from the theory's own core explanatory principle — that shared qualities require explanation via a common Form — applied consistently to itself. A theory whose defining principle, applied to its own posited entities, generates an infinite, unstoppable regress exhibits a genuine structural instability, not simply a gap awaiting further elaboration.</p><p>A fair qualification remains: Plato's own dialogue, the Parmenides, shows he was acutely aware of and seriously grappled with exactly this difficulty, without providing a fully satisfying resolution within the text itself. This leaves open whether a more sophisticated, qualified restatement of the Theory of Forms might escape the regress — a question later commentators pursued at length. Aristotle's Hylomorphic alternative, however, sidesteps this entire debate by relocating form within the particular from the outset, never requiring the problematic self-application that generates the regress in the first place.</p><h4>Conclusion</h4><p>Plato's relation between Idea and World, as originally and straightforwardly stated, is logically inconsistent — the Third Man Argument demonstrates a genuine structural instability generated by the theory's own core principle, not a mere incompleteness. Aristotle's immanent alternative succeeds precisely because it avoids the self-referential structure that generates this regress, making it the more logically secure account of how form relates to the particulars it structures.</p><button class=\"to-top\" data-jump=\"topic-top\">Back to contents</button></article>"},{"id":"comp-2","title":"2. Differentiating Plato's and Aristotle's Conceptions of Form","group":"Part III — Plato and Aristotle Compared","html":"<h4>Framing the Comparison</h4><p>Both philosophers use \"Form\" as a central technical term, but mean something structurally different by it. This topic requires organizing every point of difference already built into one clear, systematic comparative statement — worth structuring this along several precise axes rather than a single vague contrast.</p><h4>Axis 1 — Transcendent versus Immanent</h4><p>Recall Part I, Topic 5 and Part II, Topic 1 directly: Plato's Forms are transcendent — existing independently, separately, in a distinct intelligible realm, entirely apart from the sensible particulars that participate in them. Aristotle's forms are immanent — existing within the particular substance itself, as its structuring, organizing principle, never separable from the matter it informs.</p><blockquote class=\"hook\">Plato's Forms are transcendent, existing independently in a separate intelligible realm apart from the particulars that participate in them; Aristotle's forms are immanent, existing within the particular substance itself as its structuring principle, never separable from the matter it informs.</blockquote><h4>Axis 2 — One Form for Many Particulars versus Form Individuated in Each Particular</h4><p>Worth a precise point on numerical status: for Plato, there is exactly one Form of Humanity, shared identically by every human particular (recall Part I, Topic 2's participation material) — the same, single, universal Form is \"present\" (however this immanence is precisely to be understood) in every human being simultaneously. For Aristotle, by contrast, each particular substance has its own form, in an important sense — Socrates' humanity (his specific form, structuring his specific matter) is not, strictly, numerically identical with Plato's own humanity, even though both forms are qualitatively the same kind of form (recall Part II, Topic 2's refutation of universals-as-substance directly: treating a universal as literally, numerically one thing shared by many individuals was precisely what Aristotle rejected).</p><blockquote class=\"hook\">For Plato, one single, numerically identical Form of Humanity is shared by every human particular simultaneously; for Aristotle, each particular substance has its own form, individuated within that particular — Socrates' humanity and Plato's humanity are qualitatively alike but not numerically the same entity, since treating a universal as literally one thing shared by many was precisely what Aristotle's refutation of universals-as-substance rejected.</blockquote><h4>Axis 3 — Ontologically Prior to Particulars versus Constitutive of Particulars</h4><p>Recall Part I, Topic 2's ontological hierarchy and Part II, Topic 2's substance theory directly: for Plato, Forms possess greater, more fundamental reality than particulars — particulars are secondary, derivative, imperfect copies of the ontologically prior Forms. For Aristotle, form and matter are correlative, equally necessary constituents of the primary substance — neither form nor matter is prior to or more real than the concrete individual they jointly compose; rather, the concrete individual (the compound) is itself primary substance, with form and matter as its necessary, but not independently freestanding, components.</p><blockquote class=\"hook\">For Plato, Forms possess greater, ontologically prior reality, with particulars as secondary, derivative copies; for Aristotle, form and matter are correlative, equally necessary constituents of primary substance — neither is independently prior to or more real than the concrete individual compound they jointly constitute.</blockquote><h4>Axis 4 — Static/Unchanging versus Dynamically Linked to Actuality</h4><p>Recall Part I, Topic 6 and Part II, Topic 4 directly: Plato's Forms are entirely static and causally inert — eternal and unchanging in themselves, and, as built extensively, struggling to explain the dynamic process of change. Aristotle's forms are dynamically linked to Actuality — form is precisely what is achieved or realized through a process of actualization from potentiality, giving Aristotle's forms an inherently processual, developmental dimension entirely absent from Plato's static Forms.</p><blockquote class=\"hook\">Plato's Forms are entirely static and causally inert, eternal and unchanging in themselves, struggling to explain dynamic change; Aristotle's forms are dynamically linked to Actuality, achieved through a process of actualization from potentiality, giving them an inherently processual, developmental dimension Plato's static Forms lack.</blockquote><h4>Axis 5 — Epistemological Role</h4><p>Recall Part I, Topic 4's Divided Line directly: for Plato, Forms are the objects of a special, superior kind of knowledge (Episteme/Noesis), categorically distinct from, and epistemically superior to, sensory-based Doxa about particulars — knowing the sensible world at all requires, ultimately, transcending it toward the separate Forms. For Aristotle, since form is discovered within particulars (via empirical investigation, observation, and abstraction from sensible experience), the study of the sensible world itself, properly conducted, is the very route to understanding form — there is no need to transcend or look away from sensible particulars to grasp their forms, since the forms are right there, within the particulars being studied.</p><blockquote class=\"hook\">For Plato, knowing the Forms requires transcending the sensible world toward a categorically superior kind of knowledge; for Aristotle, since form exists within particulars, empirical investigation of the sensible world itself, properly conducted, is the very route to understanding form — no transcending or looking away from particulars is required.</blockquote><h4>Synthesizing — One Underlying Root Difference</h4><blockquote class=\"hook\">Every one of these five differences — transcendent/immanent, universal/individuated, ontologically-prior/correlative, static/dynamic, and their differing epistemological roles — traces back to Aristotle's single founding rejection of Chorismos: once form is relocated from a separate, transcendent realm into the particular thing itself, every other point of difference follows as a direct, necessary consequence of that one relocating move.</blockquote><div class=\"refined\"><h4>Refined notes</h4><p>Plato's and Aristotle's conceptions of Form differ across five axes, all tracing to Aristotle's rejection of Chorismos: (1) transcendent (Plato, separate intelligible realm) vs immanent (Aristotle, within the particular); (2) one numerically-identical Form shared by many (Plato) vs form individuated in each particular (Aristotle, qualitatively alike but not numerically one); (3) ontologically prior to, more real than, particulars (Plato) vs correlative, equally-necessary constituent of primary substance (Aristotle, neither form nor matter independently prior); (4) static, unchanging, causally inert (Plato) vs dynamically linked to Actuality, achieved through actualization from potentiality (Aristotle); (5) known only by transcending the sensible world (Plato's Episteme/Noesis) vs known through empirical investigation of the particulars themselves (Aristotle). All five differences are direct consequences of one founding move: relocating form from a separate realm into the particular thing itself.</p><blockquote class=\"hook\">One-line exam hook: Every difference between Plato's and Aristotle's Forms — transcendent vs immanent, one-shared vs individuated, ontologically-prior vs correlative, static vs actuality-linked, transcendence-required vs empirically-discoverable — traces back to one root move: Aristotle relocating form from Plato's separate intelligible realm into the particular thing itself.</blockquote><p class=\"kw\"><span>Keywords</span>five axes (transcendent/immanent, shared/individuated, prior/correlative, static/dynamic, epistemology), all-trace-to-Chorismos-rejection (single root difference)</p></div><article class=\"answer\" id=\"ans-2024-1-1-a\"><div class=\"answer-tag\">Model answer · 2024 · Paper I · Q1(a) · 10 marks</div><p class=\"answer-q\">Differentiate between Plato's and Aristotle's conceptions of form.</p><p>Both philosophers use \"Form\" as a central technical term, but mean structurally different things by it, differing across several precise, interconnected axes.</p><h4>Transcendent versus Immanent</h4><p>Plato's Forms are transcendent — existing independently, separately, in a distinct intelligible realm entirely apart from the sensible particulars that participate in them. Aristotle's forms are immanent — existing within the particular substance itself, as its structuring, organizing principle, never separable from the matter it informs.</p><h4>One Shared Form versus Individuated Forms</h4><p>For Plato, there is exactly one, numerically identical Form of Humanity, shared by every human particular simultaneously. For Aristotle, each particular substance has its own form, individuated within that particular: Socrates' humanity and Plato's humanity are qualitatively alike but not numerically the same entity — treating a universal as literally one thing shared by many was precisely what Aristotle's refutation of universals-as-substance rejected.</p><h4>Ontologically Prior versus Correlative</h4><p>For Plato, Forms possess greater, more fundamental reality than particulars, which are secondary, derivative, imperfect copies. For Aristotle, form and matter are correlative, equally necessary constituents of primary substance — neither is independently prior to or more real than the concrete individual compound they jointly constitute.</p><h4>Static versus Dynamically Linked to Actuality</h4><p>Plato's Forms are entirely static and causally inert — eternal and unchanging in themselves, struggling to explain the dynamic process of change. Aristotle's forms are dynamically linked to Actuality — form is precisely what is achieved through a process of actualization from potentiality, giving Aristotle's forms an inherently processual, developmental dimension Plato's static Forms lack.</p><h4>Differing Epistemological Roles</h4><p>For Plato, knowing the Forms requires transcending the sensible world toward a categorically superior kind of knowledge (Episteme/Noesis). For Aristotle, since form exists within particulars, empirical investigation of the sensible world itself is the very route to understanding form — no transcending or looking away from particulars is required.</p><h4>The Underlying Root Difference</h4><p>All five differences trace back to a single founding move: Aristotle's rejection of Chorismos (separation). Once form is relocated from a separate, transcendent realm into the particular thing itself, every other point of difference — individuation, ontological status, dynamism, and epistemological accessibility — follows as a direct, necessary consequence.</p><button class=\"to-top\" data-jump=\"topic-top\">Back to contents</button></article>"},{"id":"aris-6","title":"3. Aristotle's Unmoved Mover as Pure Actuality","group":"Beyond the PYQs","html":"<h4>Restating the Foundational Apparatus</h4><p>Recall Part II, Topic 4's entire Actuality/Potentiality material directly: Aristotle distinguishes Actuality (Energeia/Entelecheia — a thing's realized, complete state) from Potentiality (Dynamis — a thing's capacity or disposition to become something), arguing for Actuality's own priority over Potentiality both logically and ontologically. This topic develops where this apparatus ultimately leads when followed to its own, final theological conclusion. No PYQ has yet been set on it, but it is fully within the syllabus.</p><h4>Why Aristotle's Cosmology Requires an Unmoved Mover</h4><p>Recall Part II, Topic 5's own material on change and causation directly — Aristotle holds all change in the natural world is the actualization of a prior potentiality by something already actual (nothing potential can actualize itself; an acorn cannot become an oak without some already-actual cause acting upon it). Applying this same principle to the cosmos as a whole, Aristotle argues the entire, eternal chain of motion and change in the universe cannot be self-sustaining or infinitely regressive — the same regress-blocking logic recurs throughout classical theistic arguments generally — since an infinite series of things-in-motion, each itself needing a prior mover to explain its own motion, could never, as a whole, account for why there is motion at all, rather than none. There must therefore exist some first, ultimate source of all motion in the cosmos, which is itself unmoved.</p><blockquote class=\"hook\">Aristotle holds all change in the natural world is the actualization of a prior potentiality by something already actual, since nothing potential can actualize itself. Applying this to the cosmos as a whole, the entire, eternal chain of motion cannot be self-sustaining or infinitely regressive, since an infinite series of things-in-motion could never, as a whole, account for why there is motion at all, rather than none. There must therefore exist some first, ultimate source of all motion in the cosmos, which is itself unmoved.</blockquote><h4>The Unmoved Mover as Pure Actuality</h4><p>Recall Part II, Topic 4's own priority-of-actuality material directly: this first, unmoved source of motion must itself be entirely free of potentiality — pure Actuality, containing no unrealized potentiality whatsoever. If the Unmoved Mover possessed any unrealized potentiality of its own, it would itself require some further, prior actual cause to actualize that potentiality, generating precisely the same regress the argument was designed to terminate. The Unmoved Mover must therefore be wholly actual, eternally, unchangingly complete in itself, requiring nothing further to explain or complete its own being.</p><blockquote class=\"hook\">The Unmoved Mover must itself be entirely free of potentiality, pure Actuality, containing no unrealized potentiality whatsoever. If it possessed any unrealized potentiality of its own, it would require some further, prior actual cause to actualize that potentiality, generating precisely the same regress the argument was designed to terminate.</blockquote><h4>Moving Without Being Moved — Final Causation, Not Efficient Pushing</h4><p>Aristotle's own, genuinely distinctive move holds the Unmoved Mover causes motion not as an efficient cause (pushing, physically acting upon the cosmos from outside or within it) but as a final cause — an object of love, desire, and aspiration drawing the cosmos toward itself, \"moving without being moved, by being loved\" (kinei hos eromenon). The heavenly spheres, and by extension the entire cosmos, are drawn into their own eternal, circular motion by their own intellectual desire and aspiration to imitate, as perfectly as their own material nature permits, the Unmoved Mover's own perfect, unchanging actuality — motion, on this view, is the cosmos's own imperfect, temporal approximation of the divine, timeless perfection it eternally strives toward, rather than a push transmitted through mechanical contact.</p><blockquote class=\"hook\">Aristotle's own, genuinely distinctive move holds the Unmoved Mover causes motion not as an efficient cause, pushing or physically acting upon the cosmos, but as a final cause, an object of love and aspiration drawing the cosmos toward itself, \"moving without being moved, by being loved.\" Motion is the cosmos's own imperfect approximation of divine, timeless perfection, not a push transmitted through contact.</blockquote><h4>The Unmoved Mover's Own Activity — Thought Thinking Itself</h4><p>Since the Unmoved Mover is pure actuality, and since the highest, most complete form of actuality available to an intellect is the activity of thinking, Aristotle holds the Unmoved Mover's own eternal activity consists in noesis noeseos — thought thinking itself, pure self-contemplation. The Unmoved Mover cannot think about anything external to itself (since this would introduce a form of dependency, or unrealized potentiality, regarding some external object), and so its own eternal, complete activity is self-contained, perfect self-reflection, requiring nothing beyond itself.</p><h4>A Fair, Critical Evaluation</h4><p>Strengths: the Unmoved Mover offers a genuinely elegant solution terminating an otherwise infinite explanatory regress, while remaining fully consistent with, and indeed directly derived from, Aristotle's own broader Actuality/Potentiality metaphysics — rather than an ad hoc theological addition, the Unmoved Mover is the natural, logical terminus of principles already established.</p><p>Limitations: critics press that the Unmoved Mover, as pure self-contemplating thought with no awareness of, or causal interaction with, the world beyond serving as its object of aspiration, bears little resemblance to the personal, providential, world-engaging God of later theistic traditions (recall the contrast with Nyāya's own, more directly engaged Īśvara) — Aristotle's God neither knows nor cares about the world in any ordinary sense, generating a genuine, serious gap between this metaphysically-derived Unmoved Mover and any religiously satisfying conception of God.</p><blockquote class=\"hook\">Aristotle's Unmoved Mover is the natural, theological culmination of his own Actuality/Potentiality doctrine — a first, unmoved source of motion that must itself be pure Actuality, moving the cosmos not as an efficient, pushing cause but as a final cause, an object of love and aspiration, with its own eternal activity consisting in pure self-contemplation, thought thinking itself. A comprehensive, critical verdict thus holds the Unmoved Mover as a genuinely elegant, internally consistent extension of Aristotle's own metaphysics, though one generating a significant gap between this abstract, self-contained metaphysical principle and any richer, more personal, providentially-engaged conception of God.</blockquote><div class=\"refined\"><h4>Refined notes</h4><p>Why an Unmoved Mover is needed: all change = actualization of potentiality by something already actual — an infinite regress of movers can't explain why there's motion at all — so there must be a first, unmoved source. Unmoved Mover as pure Actuality: must contain no unrealized potentiality itself, or it would need a further cause, regenerating the regress. How it moves the cosmos: as final cause (object of love and aspiration), not efficient cause (pushing) — \"moves without being moved, by being loved\" — the cosmos aspires to imitate its perfect, unchanging actuality. Its own activity: noesis noeseos, thought thinking itself, pure self-contemplation, since thinking about anything external would introduce dependency. Fair evaluation: elegant, consistent extension of existing metaphysics; but generates a gap with a personal, providential God (Aristotle's God doesn't know or care about the world).</p><blockquote class=\"hook\">One-line exam hook: Aristotle's Unmoved Mover is the necessary terminus of an otherwise infinite chain of actualized potentialities — itself pure Actuality with no unrealized potentiality, moving the cosmos not as an efficient, pushing cause but as a final cause, an object of love and aspiration (\"moving without being moved, by being loved\"), with its own eternal activity consisting in noesis noeseos, thought thinking itself — a genuinely elegant metaphysical culmination, though one bearing little resemblance to a personal, providential God.</blockquote><p class=\"kw\"><span>Keywords</span>why-needed (infinite-regress-of-actualized-potentiality-can't-explain-motion), pure-actuality (no-unrealized-potentiality-or-regress-returns), how-it-moves (final-cause-not-efficient, moved-by-being-loved), its-activity (noesis-noeseos-thought-thinking-itself), fair-evaluation (elegant-consistent vs gap-with-personal-providential-God)</p></div><article class=\"answer\" id=\"ans-x-1\"><div class=\"answer-tag\">Anticipated question</div><p class=\"answer-q\">Explain Aristotle's conception of God as the Unmoved Mover. How does this follow from his doctrine of Actuality and Potentiality?</p><p>Aristotle's Unmoved Mover is the natural, theological culmination of his own Actuality/Potentiality doctrine — a first, unmoved source of motion that must itself be pure Actuality, moving the cosmos as an object of love and aspiration rather than as a pushing, efficient cause.</p><h4>Why an Unmoved Mover Is Needed</h4><p>Aristotle holds all change in the natural world is the actualization of a prior potentiality by something already actual, since nothing potential can actualize itself. Applying this principle to the cosmos as a whole, the entire, eternal chain of motion and change cannot be self-sustaining or infinitely regressive, since an infinite series of things-in-motion, each itself needing a prior mover, could never, as a whole, account for why there is motion at all, rather than none. There must therefore exist some first, ultimate source of all motion in the cosmos, which is itself unmoved.</p><h4>The Unmoved Mover as Pure Actuality</h4><p>This first, unmoved source of motion must itself be entirely free of potentiality, pure Actuality, containing no unrealized potentiality whatsoever. If the Unmoved Mover possessed any unrealized potentiality of its own, it would itself require some further, prior actual cause to actualize that potentiality, generating precisely the same regress the argument was designed to terminate. The Unmoved Mover must therefore be wholly actual, eternally, unchangingly complete in itself, requiring nothing further to explain or complete its own being.</p><h4>Moving Without Being Moved</h4><p>Aristotle's own, genuinely distinctive move holds the Unmoved Mover causes motion not as an efficient cause, pushing or physically acting upon the cosmos, but as a final cause, an object of love, desire, and aspiration drawing the cosmos toward itself, \"moving without being moved, by being loved.\" The heavenly spheres, and by extension the entire cosmos, are drawn into their own eternal, circular motion by their own aspiration to imitate, as perfectly as their own material nature permits, the Unmoved Mover's own perfect, unchanging actuality. Motion, on this view, is the cosmos's own imperfect, temporal approximation of divine, timeless perfection, rather than a push transmitted through mechanical contact.</p><h4>The Unmoved Mover's Own Activity</h4><p>Since the Unmoved Mover is pure actuality, and since the highest, most complete form of actuality available to an intellect is the activity of thinking, Aristotle holds the Unmoved Mover's own eternal activity consists in noesis noeseos, thought thinking itself, pure self-contemplation. It cannot think about anything external to itself, since this would introduce dependency or unrealized potentiality, and so its own eternal, complete activity is self-contained, perfect self-reflection.</p><h4>A Fair, Critical Evaluation</h4><p>The Unmoved Mover offers a genuinely elegant solution terminating an otherwise infinite explanatory regress, remaining fully consistent with, and directly derived from, Aristotle's own broader Actuality/Potentiality metaphysics, rather than an ad hoc theological addition. However, critics press that the Unmoved Mover, as pure self-contemplating thought with no awareness of, or causal interaction with, the world beyond serving as its object of aspiration, bears little resemblance to the personal, providential, world-engaging God of later theistic traditions, generating a genuine gap between this metaphysically-derived Unmoved Mover and any religiously satisfying conception of God.</p><h4>Conclusion</h4><p>A comprehensive, critical verdict thus holds the Unmoved Mover as a genuinely elegant, internally consistent extension of Aristotle's own metaphysics, though one generating a significant gap between this abstract, self-contained metaphysical principle and any richer, more personal, providentially-engaged conception of God.</p><button class=\"to-top\" data-jump=\"topic-top\">Back to contents</button></article>"}],"answers":[{"id":"ans-2013-1-2-a","year":2013,"paper":1,"q":2,"l":"a","marks":"12½","question":"Explain Plato's ontological theory of Forms. Is 'knowledge' one of the Forms? Give reasons.","section":"plato-2","archive":"Explain Plato's ontological theory of Forms. Is 'knowledge' one of the Forms? Give reasons."},{"id":"ans-2022-1-1-a","year":2022,"paper":1,"q":1,"l":"a","marks":"10","question":"How does Plato use the theory of forms to establish t       ${p.topics.map(t=>`
        <a class="item" href="#/topic/${p.slug}/${t.n}">
          <span class="n">${t.n}</span>
          <span><h3>${t.title}</h3><p>${t.syl}</p></span>
          ${hasNotes(p,t)
             ? `<span class="status on">${(TOPIC_CONTENT[`${p.slug}-${t.n}`]?.answers.length)||''} model answers</span>`
             : '<span class="status">No notes yet</span>'}
        </a>`).join('')}
    </div>
  </div></section>`;
}

function topicPage(slug,n,jump){
  const p = part(slug); if(!p) return notFound();
  const i = p.topics.findIndex(t=>String(t.n)===String(n));
  if(i<0) return notFound();
  const t = p.topics[i], prev = p.topics[i-1], next = p.topics[i+1];
  document.body.dataset.part = slug;
  const rich = TOPIC_CONTENT[`${slug}-${t.n}`];

  const head = `<div class="crumb"><a href="#/">Home</a> · <a href="#/part/${p.slug}">${p.name}</a></div>
    <h1 class="title read">${t.title}</h1>
    <div class="band"></div>
    <div class="syl-box read"><span>Syllabus</span>${t.syl}</div>`;

  const pager = `<div class="pager read">
      ${prev?`<a href="#/topic/${p.slug}/${prev.n}"><small>Previous</small>${prev.title}</a>`:'<span></span>'}
      ${next?`<a href="#/topic/${p.slug}/${next.n}" style="text-align:right"><small>Next</small>${next.title}</a>`:'<span></span>'}
    </div>`;

  if(!rich){
    return `<section class="page"><div class="wrap">${head}
      <div class="note"><div class="empty"><b>Notes for this topic aren\u2019t up yet.</b>They\u2019re being written and will appear here.</div></div>
      ${pager}</div></section>`;
  }

  const groups = [];
  rich.sections.forEach(s=>{
    let g = groups.find(x=>x.name===s.group);
    if(!g){ g = {name:s.group, items:[]}; groups.push(g); }
    g.items.push(s);
  });

  const index = `<div class="idx" id="topic-top">
    <h2>Contents</h2>
    <div class="idx-cols">
      ${groups.map(g=>`<div class="idx-group"><h3>${g.name}</h3><ul>${
        g.items.map(s=>`<li><a data-jump="${s.id}">${s.title}</a></li>`).join('')
      }</ul></div>`).join('')}
    </div>
  </div>`;

  const answered = rich.rows.filter(r=>r.a).length;
  const table = `<div class="pyq-block">
    <h2>Previous year questions</h2>
    <p class="sub">${rich.rows.length} questions asked on this topic between 2013 and 2026 \u2014 ${answered} with a model answer. Tap a question to jump to its answer.</p>
    <div class="pyq-table">
      ${rich.rows.map(r=>r.a
        ? `<a class="pyq-row" data-jump="${r.a}"><span class="pyq-y">${r.year}<small>Q${r.q}(${r.l})</small></span><span class="pyq-t">${esc(r.t)}</span><span class="pyq-m">${r.m}</span></a>`
        : `<div class="pyq-row off"><span class="pyq-y">${r.year}<small>Q${r.q}(${r.l})</small></span><span class="pyq-t">${esc(r.t)}<em>Answer not written yet</em></span><span class="pyq-m">${r.m}</span></div>`
      ).join('')}
    </div>
  </div>`;

  const body = rich.sections.map(s=>`<section class="tsec" id="${s.id}">
      <div class="tsec-tag">${s.group}</div>
      <h2>${s.title}</h2>
      ${s.html}
      <button class="to-top" data-jump="topic-top">Back to contents</button>
    </section>`).join('');

  pendingJump = jump || null;
  return `<section class="page"><div class="wrap">${head}${index}${table}<div class="note wide">${body}</div>${pager}</div></section>`;
}

function syllabus(){
  const group = (title,slugs)=>slugs.map(s=>{
    const p = part(s);
    return `<div class="syl-part" style="--c:${p.color}">
      <h3>${p.name}</h3>
      <ol start="${p.topics[0].n}">
        ${p.topics.map(t=>`<li><b>${t.title}:</b> ${t.syl}</li>`).join('')}
      </ol></div>`;
  }).join('');

  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a></div>
    <h1 class="title">Syllabus</h1>
    <div class="band"></div>
    <p class="sub">The Philosophy optional as notified by the Union Public Service Commission. Each entry links to its notes from the part pages.</p>

    <div class="syl-paper">
      <h2>Paper I — History and Problems of Philosophy</h2>
      <p class="note-line">Twenty topics: eleven Western, nine Indian.</p>
      ${group('Paper I',['western','indian'])}
    </div>

    <div class="syl-paper">
      <h2>Paper II</h2>
      <p class="note-line">Two sections of ten topics each.</p>
      ${group('Paper II',['socio','religion'])}
    </div>
  </div></section>`;
}

function qCount(list){ return list.reduce((a,q)=>a+q.p.length,0); }

function papers(){
  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a></div>
    <h1 class="title">Previous year papers</h1>
    <div class="band"></div>
    <p class="sub">Every Philosophy question asked in the Civil Services Mains from 2013 onwards \u2014 both papers, all parts, with marks. Pick a year.</p>
    <div class="years">
      ${PAPERS.map(y=>{
        const c = qCount(y.one) + qCount(y.two);
        return `<a class="year" href="#/paper/${y.year}"><b>${y.year}</b><small>${c?c+' questions':'Not added yet'}</small></a>`;
      }).join('')}
    </div>
  </div></section>`;
}

function questionBlocks(list, year, paper){
  let out = '', sec = '';
  list.forEach(q=>{
    if(q.s !== sec){ sec = q.s; out += `<div class="qsec">Section ${sec}</div>`; }
    out += `<div class="qblock"><span class="qn">${q.n}</span><ol class="parts">${
      q.p.map(p=>{
        const key = `${year}-${paper}-${q.n}-${p.l}`, topic = ANSWER_INDEX[key];
        const link = topic ? `<a class="ans-link" href="#/topic/${topic.replace('-','/')}/ans-${key}">Model answer</a>` : '';
        return `<li><span class="pl">(${p.l})</span><span class="pt">${p.t}${link}</span><span class="pm">${p.m}</span></li>`;
      }).join('')
    }</ol></div>`;
  });
  return out;
}

function paperYear(year){
  const y = PAPERS.find(p=>String(p.year)===String(year)); if(!y) return notFound();
  const i = PAPERS.indexOf(y), prev = PAPERS[i+1], next = PAPERS[i-1];
  const block = (name,paper,list)=>`<div class="qpaper"><h2>${name}</h2>${
    list.length ? questionBlocks(list, y.year, paper)
                : `<div class="empty"><b>Questions aren\u2019t up yet.</b>This paper will be added soon.</div>`}</div>`;
  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/">Home</a> \u00b7 <a href="#/papers">Past papers</a></div>
    <h1 class="title">Philosophy ${y.year}</h1>
    <div class="band"></div>
    <p class="sub">${qCount(y.one)+qCount(y.two)} questions. Answer five in all; questions 1 and 5 are compulsory, and at least one question from each section.</p>
    ${block('Paper I', 1, y.one)}
    ${block('Paper II', 2, y.two)}
    <div class="pager">
      ${next?`<a href="#/paper/${next.year}"><small>Next year</small>Philosophy ${next.year}</a>`:'<span></span>'}
      ${prev?`<a href="#/paper/${prev.year}" style="text-align:right"><small>Previous year</small>Philosophy ${prev.year}</a>`:'<span></span>'}
    </div>
  </div></section>`;
}

function notFound(){
  return `<section class="page"><div class="wrap read">
    <h1 class="title">Page not found</h1>
    <div class="band"></div>
    <p>That link doesn’t point anywhere on this site. <a href="#/">Go back to the home page</a>.</p>
  </div></section>`;
}

/* ---------------- router ---------------- */
let pendingJump = null;

function scrollTo_(id){
  const el = document.getElementById(id); if(!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - ($('.topbar').offsetHeight + 14);
  window.scrollTo({top, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-jump]');
  if(b){ e.preventDefault(); scrollTo_(b.dataset.jump); }
});

function render(){
  const path = (location.hash.replace(/^#\/?/,'') || '').split('/').filter(Boolean);
  document.body.dataset.part = '';
  pendingJump = null;
  let html, key = '';
  if(path[0]==='part'){ html = partPage(path[1]); key = path[1]; }
  else if(path[0]==='topic'){ html = topicPage(path[1],path[2],path[3]); key = path[1]; }
  else if(path[0]==='syllabus'){ html = syllabus(); key='syllabus'; }
  else if(path[0]==='papers'){ html = papers(); key='papers'; }
  else if(path[0]==='paper'){ html = paperYear(path[1]); key='papers'; }
  else if(path.length===0){ html = home(); }
  else html = notFound();

  $('#app').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===key));
  $('#nav').classList.remove('open');
  $('#res').classList.remove('open'); $('#q').value='';
  window.scrollTo(0,0);
  if(pendingJump) requestAnimationFrame(()=>scrollTo_(pendingJump));
}
addEventListener('hashchange', render);

/* ---------------- search ---------------- */
const ANSWER_HITS = Object.entries(TOPIC_CONTENT).flatMap(([key,t])=>{
  const [slug,num] = key.split('-');
  return t.answers.map(a=>({
    title: a.question.length>90 ? a.question.slice(0,90)+'\u2026' : a.question,
    syl:'', part: a.year ? `Model answer \u00b7 ${a.year} \u00b7 Q${a.q}(${a.l})` : 'Model answer',
    color:'var(--accent)', href:`#/topic/${slug}/${num}/${a.id}`
  }));
});

const INDEX = PARTS.flatMap(p=>p.topics.map(t=>({
  title:t.title, syl:t.syl, part:p.name, color:p.color, href:`#/topic/${p.slug}/${t.n}`
}))).concat(
  PAPERS.flatMap(y=>[['Paper I',y.one],['Paper II',y.two]].flatMap(([nm,list])=>
    list.flatMap(q=>q.p.map(pt=>({
      title: pt.t.length>90 ? pt.t.slice(0,90)+'\u2026' : pt.t,
      syl:'', part:`${y.year} \u00b7 ${nm} \u00b7 Q${q.n}(${pt.l})`,
      color:'var(--ink-faint)', href:`#/paper/${y.year}`
    })))))
).concat(ANSWER_HITS);

$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  const box = $('#res');
  if(v.length<2){ box.classList.remove('open'); return; }
  const hits = INDEX.filter(x=>(x.title+' '+x.syl+' '+x.part).toLowerCase().includes(v)).slice(0,14);
  box.innerHTML = hits.length
    ? hits.map(h=>`<a href="${h.href}" style="--c:${h.color}"><b>${esc(h.title)}</b><span>${esc(h.part)}</span></a>`).join('')
    : `<div class="none">No topic matches that.</div>`;
  box.classList.add('open');
});
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) $('#res').classList.remove('open'); });

/* ---------------- visit counter ----------------
   To switch on the site-wide counter:
   1. make a free account at goatcounter.com and note your site code
      (the "mukul" in mukul.goatcounter.com)
   2. in Settings there, tick "Allow adding visitor counts on your website"
   3. put your code between the quotes below.
   Until then the counter just counts visits in your own browser.
   GoatCounter caches the total for up to four hours, so a fresh visit
   may take a while to show up.                                        */
const GC_CODE = '';

function loadGoatCounter(){
  if(!GC_CODE) return;
  const s = document.createElement('script');
  s.dataset.goatcounter = `https://${GC_CODE}.goatcounter.com/count`;
  s.async = true; s.src = '//gc.zgo.at/count.js';
  document.body.appendChild(s);
}

async function countVisit(){
  const out = $('#visits');
  const show = n => out.textContent = n;
  const KEY = 'darsana:visits';

  if(GC_CODE){
    loadGoatCounter();
    try{
      const r = await fetch(`https://${GC_CODE}.goatcounter.com/counter/TOTAL.json`);
      const d = await r.json();
      if(d && d.count){ show(d.count); return; }
    }catch(_){}
  }
  try{
    if(window.storage){
      let n = 0;
      try{ const r = await window.storage.get(KEY, true); n = parseInt(r && r.value, 10) || 0; }catch(_){}
      n += 1;
      await window.storage.set(KEY, String(n), true);
      show(n.toLocaleString('en-IN')); return;
    }
  }catch(_){}
  try{
    const n = (parseInt(window.localStorage.getItem(KEY),10) || 0) + 1;
    window.localStorage.setItem(KEY, String(n));
    show(n.toLocaleString('en-IN'));
  }catch(_){ show('1'); }
}

render();
countVisit();
</script>
