<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darśana — Philosophy notes for UPSC</title>
<meta name="description" content="Free Philosophy optional notes, syllabus and previous year papers for the UPSC Civil Services examination.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETTE — cool paper, ink, and four colours that identify
   the four parts of the syllabus. Colour here is navigation,
   not decoration: a page always wears the colour of its part.
   ============================================================ */
:root{
  --paper:#EFEDE6;
  --paper-2:#E6E4DB;
  --ink:#16181D;
  --ink-soft:#4A4C51;
  --ink-faint:#7C7D79;
  --rule:#CFCDC2;

  --western:#2A2F6E;   /* indigo   */
  --indian:#2F6D62;    /* verdigris*/
  --socio:#8C2F24;     /* madder   */
  --religion:#8A6212;  /* ochre    */

  --accent:var(--western);

  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --deva:'Tiro Devanagari Hindi','Noto Serif Devanagari',serif;

  --wrap:72rem;
  --read:38rem;
}
[data-part="western"]  {--accent:var(--western);}
[data-part="indian"]   {--accent:var(--indian);}
[data-part="socio"]    {--accent:var(--socio);}
[data-part="religion"] {--accent:var(--religion);}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-weight:300;font-size:1.0625rem;line-height:1.7;
  font-variant-numeric:oldstyle-num;
}
a{color:inherit;}
::selection{background:var(--accent);color:var(--paper);}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 1.5rem;}
.read{max-width:var(--read);}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.topbar .wrap{display:flex;align-items:center;gap:1.25rem;height:4rem;}
.mark{display:flex;align-items:baseline;gap:.55rem;text-decoration:none;flex:none;}
.mark .deva{font-family:var(--deva);font-size:1.35rem;line-height:1;}
.mark .rom{font-family:var(--sans);font-size:.9rem;font-weight:600;letter-spacing:.01em;}
.nav{display:flex;gap:1.1rem;margin-left:auto;font-family:var(--sans);font-size:.875rem;}
.nav a{text-decoration:none;color:var(--ink-soft);padding:.35rem 0;border-bottom:2px solid transparent;}
.nav a:hover{color:var(--ink);}
.nav a.on{color:var(--ink);border-bottom-color:var(--accent);}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--rule);border-radius:3px;
  font-family:var(--sans);font-size:.85rem;padding:.4rem .7rem;cursor:pointer;color:var(--ink);}

/* ---------- search ---------- */
.search{position:relative;flex:none;width:13rem;}
.search input{
  width:100%;font-family:var(--sans);font-size:.85rem;padding:.45rem .7rem;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;color:var(--ink);
}
.search input::placeholder{color:var(--ink-faint);}
.results{
  position:absolute;top:110%;right:0;width:22rem;max-width:78vw;max-height:60vh;overflow:auto;
  background:var(--paper);border:1px solid var(--rule);box-shadow:0 14px 40px -22px rgba(22,24,29,.55);
  padding:.35rem;display:none;
}
.results.open{display:block;}
.results a{display:block;text-decoration:none;padding:.5rem .6rem;border-left:3px solid var(--c);}
.results a:hover{background:var(--paper-2);}
.results b{font-weight:600;font-size:.95rem;}
.results span{display:block;font-family:var(--sans);font-size:.72rem;color:var(--ink-faint);}
.results .none{padding:.8rem .6rem;font-family:var(--sans);font-size:.82rem;color:var(--ink-faint);}

/* ---------- hero ---------- */
.hero{padding:5.5rem 0 3.5rem;border-bottom:1px solid var(--rule);}
.hero-deva{
  font-family:var(--deva);font-size:clamp(4.5rem,15vw,10rem);line-height:.92;margin:0;
  letter-spacing:-.01em;
}
.hero-line{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:1rem;margin:.6rem 0 0;
  font-family:var(--sans);font-size:.95rem;color:var(--ink-soft);
}
.hero-line .rom{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:var(--ink);}
.hero p{max-width:34rem;margin:1.6rem 0 0;font-size:1.15rem;line-height:1.65;}
.reveal{opacity:0;transform:translateY(10px);animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards;}
.reveal:nth-child(2){animation-delay:.1s;}
.reveal:nth-child(3){animation-delay:.18s;}
@keyframes rise{to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none;}}

/* ---------- part grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0;}
.card{
  background:var(--paper);padding:2rem 1.75rem 1.75rem;text-decoration:none;display:block;
  border-top:4px solid var(--c);transition:background .18s;
}
.card:hover{background:var(--paper-2);}
.card h2{font-size:1.6rem;font-weight:600;margin:.2rem 0 .5rem;letter-spacing:-.01em;}
.card .paper{font-family:var(--sans);font-size:.72rem;color:var(--c);font-weight:600;}
.card p{margin:0 0 1rem;color:var(--ink-soft);font-size:1rem;max-width:30rem;}
.card .peek{font-family:var(--sans);font-size:.78rem;color:var(--ink-faint);line-height:1.6;}
.card .count{font-family:var(--sans);font-size:.78rem;color:var(--c);font-weight:500;}

/* ---------- two wide links ---------- */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border-bottom:1px solid var(--rule);}
.slab{background:var(--paper);padding:1.6rem 1.75rem;text-decoration:none;display:flex;
  justify-content:space-between;align-items:center;gap:1rem;transition:background .18s;}
.slab:hover{background:var(--paper-2);}
.slab b{font-size:1.15rem;font-weight:600;}
.slab small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--ink-faint);margin-top:.15rem;}
.slab .arrow{font-family:var(--sans);color:var(--ink-faint);}

/* ---------- page headers ---------- */
.page{padding:3rem 0 4rem;}
.crumb{font-family:var(--sans);font-size:.78rem;color:var(--ink-faint);margin-bottom:1rem;}
.crumb a{text-decoration:none;color:var(--accent);}
.crumb a:hover{text-decoration:underline;}
h1.title{font-size:clamp(2rem,5vw,3rem);font-weight:600;line-height:1.1;margin:0 0 .6rem;letter-spacing:-.015em;}
.sub{font-family:var(--sans);font-size:.9rem;color:var(--ink-soft);margin:0 0 2.5rem;}
.band{height:4px;background:var(--accent);width:4.5rem;margin:0 0 2rem;}

/* ---------- topic list ---------- */
.list{border-top:1px solid var(--rule);}
.item{display:flex;gap:1.25rem;align-items:baseline;padding:1.05rem .4rem;border-bottom:1px solid var(--rule);
  text-decoration:none;transition:background .15s,padding-left .15s;}
.item:hover{background:var(--paper-2);padding-left:.9rem;}
.item .n{font-family:var(--sans);font-size:.8rem;color:var(--accent);width:1.9rem;flex:none;font-weight:600;}
.item h3{margin:0;font-size:1.2rem;font-weight:600;}
.item p{margin:.15rem 0 0;font-size:.95rem;color:var(--ink-soft);}
.item .status.on{color:var(--accent);border-color:var(--accent);}
.status{margin-left:auto;font-family:var(--sans);font-size:.7rem;color:var(--ink-faint);
  border:1px solid var(--rule);padding:.1rem .4rem;border-radius:2px;flex:none;}

/* ---------- notes body ---------- */
.note{max-width:var(--read);}
.note.wide{max-width:46rem;}

/* contents index */
.idx{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:1.6rem 0 1.8rem;margin:0 0 2.5rem;scroll-margin-top:5rem;}
.idx h2{font-size:1.15rem;font-weight:600;margin:0 0 1.1rem;}
.idx-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.6rem 2.5rem;}
.idx-group h3{font-family:var(--sans);font-size:.78rem;font-weight:600;color:var(--accent);margin:0 0 .5rem;}
.idx-group ul{list-style:none;margin:0;padding:0;}
.idx-group li{margin:.3rem 0;}
.idx-group a{text-decoration:none;cursor:pointer;border-bottom:1px solid transparent;}
.idx-group a:hover{border-bottom-color:var(--accent);}

/* pyq table on a topic page */
.pyq-block{margin:0 0 3.5rem;}
.pyq-block h2{font-size:1.15rem;font-weight:600;margin:0 0 .4rem;}
.pyq-block .sub{margin:0 0 1.2rem;max-width:40rem;}
.pyq-table{border-top:1px solid var(--rule);}
.pyq-row{display:grid;grid-template-columns:5.5rem 1fr 3rem;gap:1rem;align-items:baseline;
  padding:.8rem .4rem;border-bottom:1px solid var(--rule);text-decoration:none;transition:background .15s,padding-left .15s;}
a.pyq-row:hover{background:var(--paper-2);padding-left:.9rem;}
.pyq-row.off{color:var(--ink-faint);}
.pyq-y{font-family:var(--sans);font-size:.85rem;font-weight:600;color:var(--accent);font-variant-numeric:lining-num;}
.pyq-row.off .pyq-y{color:var(--ink-faint);}
.pyq-y small{display:block;font-weight:400;font-size:.72rem;color:var(--ink-faint);}
.pyq-t{font-size:1rem;}
.pyq-t em{display:block;font-family:var(--sans);font-size:.72rem;font-style:normal;color:var(--ink-faint);margin-top:.2rem;}
.pyq-m{font-family:var(--sans);font-size:.75rem;color:var(--ink-faint);text-align:right;font-variant-numeric:lining-num;}

/* long-form sections */
.tsec{padding:2.5rem 0 1rem;border-top:1px solid var(--rule);scroll-margin-top:5rem;}
.tsec-tag{font-family:var(--sans);font-size:.72rem;color:var(--accent);margin-bottom:.35rem;}
.tsec>h2{font-size:1.6rem;font-weight:600;line-height:1.2;margin:0 0 1.2rem;letter-spacing:-.01em;}
.tsec h4{font-size:1.08rem;font-weight:600;margin:1.8rem 0 .5rem;}
.tsec p{margin:0 0 1rem;}
blockquote.hook{margin:1.3rem 0;padding:.15rem 0 .15rem 1.1rem;border-left:3px solid var(--accent);
  font-style:italic;color:var(--ink-soft);}
.refined{background:var(--paper-2);padding:1.3rem 1.4rem .4rem;margin:2rem 0 1rem;border-top:3px solid var(--accent);}
.refined h4{margin-top:0;font-family:var(--sans);font-size:.8rem;color:var(--ink-soft);}
.refined blockquote.hook{border-left-color:var(--ink-faint);}
.kw{font-family:var(--sans);font-size:.8rem;color:var(--ink-soft);line-height:1.6;}
.kw span{display:block;font-size:.72rem;color:var(--ink-faint);margin-bottom:.15rem;}

/* model answers */
.answer{border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--paper);
  padding:1.5rem 1.5rem .6rem;margin:2.5rem 0;scroll-margin-top:5rem;}
.answer-tag{font-family:var(--sans);font-size:.72rem;color:var(--accent);font-weight:600;margin-bottom:.5rem;}
.answer-q{font-size:1.15rem;font-weight:600;margin:0 0 1.1rem;}
.answer h4{font-size:1rem;}
.to-top{display:block;margin:1.4rem 0 1rem;background:none;border:none;padding:0;cursor:pointer;
  font-family:var(--sans);font-size:.75rem;color:var(--ink-faint);text-decoration:underline;}
.to-top:hover{color:var(--accent);}
.ans-link{display:inline-block;margin-left:.5rem;font-family:var(--sans);font-size:.72rem;
  color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule);white-space:nowrap;}
.ans-link:hover{border-bottom-color:var(--accent);}
.note h2{font-size:1.45rem;font-weight:600;margin:2.4rem 0 .6rem;}
.note h3{font-size:1.15rem;font-weight:600;margin:1.8rem 0 .4rem;}
.note p{margin:0 0 1.1rem;}
.note ul,.note ol{margin:0 0 1.1rem;padding-left:1.2rem;}
.note li{margin:.3rem 0;}
.note blockquote{margin:1.4rem 0;padding-left:1.1rem;border-left:3px solid var(--accent);
  font-style:italic;color:var(--ink-soft);}
.note table{border-collapse:collapse;width:100%;margin:1.4rem 0;font-size:.95rem;}
.note th,.note td{border:1px solid var(--rule);padding:.5rem .65rem;text-align:left;vertical-align:top;}
.note th{background:var(--paper-2);font-weight:600;}
.syl-box{background:var(--paper-2);border-left:4px solid var(--accent);padding:1rem 1.2rem;margin:0 0 2.2rem;
  font-size:1rem;}
.syl-box span{display:block;font-family:var(--sans);font-size:.72rem;color:var(--ink-faint);margin-bottom:.25rem;}

.empty{border:1px dashed var(--rule);padding:2.2rem 1.5rem;text-align:center;color:var(--ink-faint);
  font-family:var(--sans);font-size:.9rem;}
.empty b{display:block;font-family:var(--serif);font-size:1.1rem;color:var(--ink-soft);font-weight:400;margin-bottom:.3rem;}

.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3.5rem;padding-top:1.2rem;
  border-top:1px solid var(--rule);font-family:var(--sans);font-size:.85rem;}
.pager a{text-decoration:none;color:var(--accent);max-width:45%;}
.pager a:hover{text-decoration:underline;}
.pager small{display:block;color:var(--ink-faint);font-size:.72rem;}

/* ---------- syllabus page ---------- */
.syl-paper{margin:0 0 3.5rem;}
.syl-paper h2{font-size:1.5rem;font-weight:600;margin:0 0 .2rem;}
.syl-paper .note-line{font-family:var(--sans);font-size:.82rem;color:var(--ink-faint);margin:0 0 1.5rem;}
.syl-part{border-left:3px solid var(--c);padding-left:1.1rem;margin:0 0 2rem;}
.syl-part h3{font-size:1.05rem;font-family:var(--sans);font-weight:600;color:var(--c);margin:0 0 .7rem;}
.syl-part ol{margin:0;padding-left:1.3rem;}
.syl-part li{margin:.45rem 0;max-width:46rem;}
.syl-part li b{font-weight:600;}

/* ---------- papers ---------- */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);}
.year{background:var(--paper);text-decoration:none;padding:1.2rem 1rem;transition:background .15s;}
.year:hover{background:var(--paper-2);}
.year b{display:block;font-size:1.5rem;font-weight:600;font-variant-numeric:lining-num;}
.year small{font-family:var(--sans);font-size:.72rem;color:var(--ink-faint);}
.qpaper{margin:0 0 3.5rem;}
.qpaper h2{font-size:1.35rem;font-weight:600;border-bottom:2px solid var(--ink);padding-bottom:.5rem;margin:0 0 .5rem;}
.qsec{font-family:var(--sans);font-size:.75rem;color:var(--ink-faint);letter-spacing:.02em;
  padding:1.4rem 0 .4rem;}
.qblock{display:flex;gap:1.1rem;padding:.9rem 0;border-top:1px solid var(--rule);}
.qblock .qn{font-family:var(--sans);font-size:.95rem;font-weight:600;color:var(--accent);
  width:1.5rem;flex:none;font-variant-numeric:lining-num;padding-top:.1rem;}
.parts{list-style:none;margin:0;padding:0;flex:1;min-width:0;}
.parts li{display:flex;gap:.55rem;margin:0 0 .85rem;align-items:baseline;}
.parts li:last-child{margin-bottom:0;}
.pl{font-family:var(--sans);font-size:.78rem;color:var(--ink-faint);flex:none;width:1.2rem;}
.pt{flex:1;max-width:46rem;}
.pm{font-family:var(--sans);font-size:.72rem;color:var(--ink-faint);flex:none;
  font-variant-numeric:lining-num;padding-left:.6rem;}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);background:var(--paper-2);padding:2.5rem 0;margin-top:4rem;}
footer .wrap{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;
  font-family:var(--sans);font-size:.85rem;color:var(--ink-soft);}
.by{font-family:var(--serif);font-size:1rem;}
.counter{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink-soft);}
.counter svg{width:1.15rem;height:1.15rem;stroke:var(--ink-soft);fill:none;stroke-width:1.4;}
.counter b{font-weight:600;font-variant-numeric:lining-num;}
.counter small{color:var(--ink-faint);}

@media (max-width:760px){
  .topbar .wrap{height:auto;padding-top:.7rem;padding-bottom:.7rem;flex-wrap:wrap;}
  .menu-btn{display:block;}
  .nav{display:none;order:3;width:100%;flex-wrap:wrap;gap:.9rem 1.1rem;padding-bottom:.5rem;margin-left:0;}
  .nav.open{display:flex;}
  .search{order:2;width:100%;}
  .results{width:100%;}
  .grid,.pair,.years{grid-template-columns:1fr;}
  .hero{padding:3.5rem 0 2.5rem;}
  .item{flex-wrap:wrap;}
  .pyq-row{grid-template-columns:1fr 2.5rem;gap:.3rem .8rem;}
  .pyq-y{grid-column:1;}
  .pyq-y small{display:inline;margin-left:.4rem;}
  .pyq-m{grid-column:2;grid-row:1;}
  .pyq-t{grid-column:1 / -1;}
  .answer{padding:1.2rem 1rem .5rem;}
  .item .status{margin-left:0;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="mark" href="#/"><span class="deva">दर्शन</span><span class="rom">Darśana</span></a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false">Menu</button>
    <nav class="nav" id="nav"></nav>
    <div class="search">
      <input id="q" type="search" placeholder="Search topics" autocomplete="off" aria-label="Search topics">
      <div class="results" id="res"></div>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span class="by">Made by Mukul Jakhar</span>
    <span class="counter" title="Total visits to this site">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
      <b id="visits">—</b><small>visits</small>
    </span>
  </div>
</footer>

<script>
/* ================================================================
   CONTENT LIVES HERE.

   To publish notes for a topic, find it below and fill its
   `content` field with HTML between the backticks:

       content: `
         <p>Opening paragraph.</p>
         <h2>Plato's theory of Ideas</h2>
         <ul><li>Point one</li><li>Point two</li></ul>
         <blockquote>A quotation.</blockquote>
         <table><tr><th>Thinker</th><th>Position</th></tr>
                <tr><td>Plato</td><td>…</td></tr></table>
       `,

   Leave it as '' and the topic shows an "not up yet" notice.
   ================================================================ */

const PARTS = [
  {
    slug:'western', name:'Western Philosophy', paper:'Paper I', color:'var(--western)',
    blurb:'Greek beginnings through rationalism, empiricism and Kant, to the analytic and continental turns of the twentieth century.',
    topics:[
      {n:1, title:'Plato and Aristotle', syl:'Ideas; Substance; Form and Matter; Causation; Actuality and Potentiality.', content:''},
      {n:2, title:'Rationalism: Descartes, Spinoza, Leibniz', syl:'Cartesian Method and Certain Knowledge; Substance; God; Mind-Body Dualism; Determinism and Freedom.', content:''},
      {n:3, title:'Empiricism: Locke, Berkeley, Hume', syl:'Theory of Knowledge; Substance and Qualities; Self and God; Scepticism.', content:''},
      {n:4, title:'Kant', syl:'Possibility of Synthetic a priori Judgments; Space and Time; Categories; Ideas of Reason; Antinomies; Critique of Proofs for the Existence of God.', content:''},
      {n:5, title:'Hegel', syl:'Dialectical Method; Absolute Idealism.', content:''},
      {n:6, title:'Moore, Russell and Early Wittgenstein', syl:'Defence of Commonsense; Refutation of Idealism; Logical Atomism; Logical Constructions; Incomplete Symbols; Picture Theory of Meaning; Saying and Showing.', content:''},
      {n:7, title:'Logical Positivism', syl:'Verification Theory of Meaning; Rejection of Metaphysics; Linguistic Theory of Necessary Propositions.', content:''},
      {n:8, title:'Later Wittgenstein', syl:'Meaning and Use; Language-games; Critique of Private Language.', content:''},
      {n:9, title:'Phenomenology: Husserl', syl:'Method; Theory of Essences; Avoidance of Psychologism.', content:''},
      {n:10, title:'Existentialism: Kierkegaard, Sartre, Heidegger', syl:'Existence and Essence; Choice, Responsibility and Authentic Existence; Being-in-the-world and Temporality.', content:''},
      {n:11, title:'Quine and Strawson', syl:'Critique of Empiricism; Theory of Basic Particulars and Persons.', content:''}
    ]
  },
  {
    slug:'indian', name:'Indian Philosophy', paper:'Paper I', color:'var(--indian)',
    blurb:'The heterodox and orthodox systems, from Cārvāka materialism to the schools of Vedānta and Aurobindo’s integral yoga.',
    topics:[
      {n:12, title:'Cārvāka', syl:'Theory of Knowledge; Rejection of Transcendent Entities.', content:''},
